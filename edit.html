<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পণ্য এডিট | Ghoti Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); max-width: 500px; margin: auto; }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-family: inherit; }
        .update-btn { width: 100%; padding: 15px; background: #2ecc71; color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #777; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>পণ্য এডিট করুন</h2>
    <div id="loader">লোড হচ্ছে...</div>
    <form id="editForm" style="display: none;">
        <div class="form-group">
            <label>পণ্যের নাম</label>
            <input type="text" id="pName" required>
        </div>
        <div class="form-group">
            <label>দাম (৳)</label>
            <input type="number" id="pPrice" required>
        </div>
        <div class="form-group">
            <label>কিওয়ার্ড (খোঁজার সুবিধার জন্য)</label>
            <input type="text" id="pKey" placeholder="যেমন: জামা, সুতি, নীল">
        </div>
        <div class="form-group">
            <label>বিস্তারিত বিবরণ</label>
            <textarea id="pDesc" rows="4"></textarea>
        </div>
        <button type="submit" class="update-btn">আপডেট করুন</button>
    </form>
    <a href="dashboard.html" class="back-link">ফিরে যান</a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE", 
        authDomain: "ghotimarket.firebaseapp.com",
        projectId: "ghotimarket" 
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    if(!productId) window.location.href = "dashboard.html";

    const form = document.getElementById('editForm');
    const loader = document.getElementById('loader');

    // ডাটা লোড করা
    async function loadData() {
        const snap = await getDoc(doc(db, "products", productId));
        if(snap.exists()){
            const data = snap.data();
            document.getElementById('pName').value = data.name;
            document.getElementById('pPrice').value = data.price;
            document.getElementById('pKey').value = data.keywords || "";
            document.getElementById('pDesc').value = data.description || "";
            loader.style.display = "none";
            form.style.display = "block";
        } else {
            alert("পণ্যটি পাওয়া যায়নি!");
            window.location.href = "dashboard.html";
        }
    }
    loadData();

    // আপডেট করা
    form.onsubmit = async (e) => {
        e.preventDefault();
        try {
            await updateDoc(doc(db, "products", productId), {
                name: document.getElementById('pName').value,
                price: document.getElementById('pPrice').value,
                keywords: document.getElementById('pKey').value,
                description: document.getElementById('pDesc').value
            });
            alert("সফলভাবে আপডেট হয়েছে!");
            window.location.href = "dashboard.html";
        } catch (err) {
            alert("আপডেট করতে সমস্যা হয়েছে!");
        }
    };
</script>

</body>
</html>
