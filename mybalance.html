<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Wallet & Transaction History - GHOTI MARKET</title>
  
  <!-- Google Font: Hind Siliguri -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome 6.5.1 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --primary: #ff6a00;
      --primary-dark: #e05d00;
      --primary-light: #fff0eb;
      --secondary: #ff8533;
      --bg: #fff7f1;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border: #fee2d5;
      --success: #10b981;
      --success-light: #ecfdf5;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --warning: #f59e0b;
      --warning-light: #fffbebf;
      --radius: 16px;
      --shadow-sm: 0 2px 8px rgba(255, 106, 0, 0.05);
      --shadow-md: 0 10px 25px -5px rgba(255, 106, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 40px;
    }

    /* Ambient Background Blobs */
    .bg-blob {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255, 106, 0, 0.12), rgba(255, 133, 51, 0.05));
      filter: blur(60px);
      z-index: -1;
      pointer-events: none;
    }
    .blob-1 { top: -50px; left: -50px; }
    .blob-2 { bottom: 10%; right: -50px; }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: #ffffff;
      color: var(--text-main);
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 4px solid var(--primary);
      animation: slideIn 0.3s ease-out forwards;
      max-width: 350px;
    }

    .toast.error { border-left-color: var(--danger); }
    .toast.success { border-left-color: var(--success); }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Sticky Header */
    .app-header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 1000;
      padding: 14px 20px;
    }

    .header-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      display: flex;
      flex-direction: column;
    }

    .brand-title .logo-text {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.1;
      letter-spacing: 0.5px;
    }

    .brand-title .page-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .btn-dashboard {
      background-color: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-dashboard:hover {
      background-color: var(--primary);
      color: #ffffff;
    }

    /* Main Container */
    .container {
      max-width: 1100px;
      width: 100%;
      margin: 20px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Cards Common */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    /* 1. Wallet Card */
    .wallet-card {
      background: linear-gradient(135deg, #ffffff 0%, #fff0eb 100%);
      border: 1.5px solid var(--border);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    .wallet-card::after {
      content: '';
      position: absolute;
      top: -30px;
      right: -30px;
      width: 120px;
      height: 120px;
      background: rgba(255, 106, 0, 0.08);
      border-radius: 50%;
      pointer-events: none;
    }

    .wallet-header {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .wallet-balance {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .wallet-tag {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 18px;
    }

    .btn-add-balance {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: #ffffff;
      width: 100%;
      padding: 12px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 4px 15px rgba(255, 106, 0, 0.25);
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
    }

    .btn-add-balance:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 106, 0, 0.35);
    }

    /* 2. Status Card */
    .status-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .status-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .status-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .status-badge {
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-active { color: var(--success); }
    .badge-inactive { color: var(--danger); }
    .badge-verified { color: var(--success); }
    .badge-unverified { color: var(--warning); }

    /* 3. Seller Info Card */
    .seller-info-card {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .seller-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid var(--border);
      object-fit: cover;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 1.5rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .seller-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .seller-shop-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .seller-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .seller-uid {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--bg);
      padding: 2px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 4px;
      width: fit-content;
      font-family: monospace;
    }

    /* 4. Transaction History Section */
    .tx-section-header {
      margin-top: 10px;
      margin-bottom: 12px;
    }

    .tx-section-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .tx-section-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .transaction-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Transaction Card Item */
    .tx-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }

    .tx-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .tx-type-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tx-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .tx-icon.buy { background: var(--primary-light); color: var(--primary); }
    .tx-icon.add { background: var(--success-light); color: var(--success); }
    .tx-icon.refund { background: #eff6ff; color: #3b82f6; }
    .tx-icon.default { background: #f3f4f6; color: #4b5563; }

    .tx-title-area {
      display: flex;
      flex-direction: column;
    }

    .tx-package-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .tx-type-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tx-amount {
      font-size: 1.15rem;
      font-weight: 700;
      text-align: right;
      white-space: nowrap;
    }

    .tx-amount.negative { color: var(--danger); }
    .tx-amount.positive { color: var(--success); }

    .tx-divider {
      height: 1px;
      background-color: var(--border);
      width: 100%;
    }

    .tx-details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px 16px;
      font-size: 0.85rem;
    }

    .tx-detail-item {
      display: flex;
      flex-direction: column;
    }

    .tx-detail-label {
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .tx-detail-val {
      color: var(--text-main);
      font-weight: 600;
    }

    .tx-note {
      background: var(--bg);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tx-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .tx-status-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
      color: var(--success);
      background: var(--success-light);
      padding: 2px 8px;
      border-radius: 6px;
    }

    /* Skeleton Loading State */
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #f8f8f8 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 8px;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-text {
      height: 16px;
      width: 60%;
      margin-bottom: 8px;
    }

    .skeleton-title {
      height: 28px;
      width: 40%;
      margin-bottom: 12px;
    }

    .skeleton-card {
      height: 120px;
      width: 100%;
    }

    /* Empty State */
    .empty-state {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .empty-icon {
      font-size: 3rem;
      color: var(--border);
      margin-bottom: 8px;
    }

    .empty-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .empty-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
      max-width: 320px;
    }

    /* Pagination / Load More Button */
    .btn-load-more {
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--primary);
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      text-align: center;
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .btn-load-more:hover {
      background: var(--primary-light);
    }

    /* Responsive Grid Adjustments */
    @media (min-width: 768px) {
      .top-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .btn-add-balance {
        width: auto;
      }
    }

    /* Safe Display Control */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Ambient Blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Sticky Page Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-title">
        <span class="logo-text">GHOTI MARKET</span>
        <span class="page-subtitle">Seller Wallet</span>
      </div>
      <a href="https://seller.ghotimarket.com/dashboard" class="btn-dashboard">
        <i class="fa-solid fa-house"></i>
        <span>Dashboard</span>
      </a>
    </div>
  </header>

  <!-- Main Content Body -->
  <main class="container">

    <div class="top-grid">
      <!-- 1. Wallet Balance Card -->
      <section class="card wallet-card">
        <div class="wallet-header">
          <i class="fa-solid fa-wallet"></i>
          <span>Available Balance</span>
        </div>
        <div class="wallet-balance" id="walletBalanceDisplay">
          <div class="skeleton skeleton-title" style="width: 180px; height: 40px;"></div>
        </div>
        <div class="wallet-tag">Seller Wallet Account</div>
        <button class="btn-add-balance" onclick="window.location.href='add-balance.html'">
          <i class="fa-solid fa-plus"></i>
          <span>Add Balance</span>
        </button>
      </section>

      <!-- Account Status & Seller Info Container -->
      <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 15px;">
        
        <!-- 2. Account Status Card -->
        <section class="card status-card" id="statusCard">
          <div class="status-item">
            <span class="status-label">Account Status</span>
            <div class="status-badge" id="statusActive">
              <span class="skeleton skeleton-text" style="width: 70px;"></span>
            </div>
          </div>
          <div class="status-item">
            <span class="status-label">Verification</span>
            <div class="status-badge" id="statusVerified">
              <span class="skeleton skeleton-text" style="width: 70px;"></span>
            </div>
          </div>
        </section>

        <!-- 3. Seller Information Card -->
        <section class="card seller-info-card" id="sellerInfoCard">
          <div id="sellerAvatarContainer">
            <div class="seller-avatar skeleton"></div>
          </div>
          <div class="seller-details">
            <div class="seller-shop-name" id="sellerShopName">
              <div class="skeleton skeleton-text" style="width: 140px; height: 20px;"></div>
            </div>
            <div class="seller-meta" id="sellerMeta">
              <div class="skeleton skeleton-text" style="width: 180px;"></div>
            </div>
            <div class="seller-uid" id="sellerUid">
              UID: Loading...
            </div>
          </div>
        </section>

      </div>
    </div>

    <!-- 4. Transaction History Section -->
    <section>
      <div class="tx-section-header">
        <h2 class="tx-section-title">Transaction History</h2>
        <p class="tx-section-subtitle">আপনার Wallet-এর সকল লেনদেন</p>
      </div>

      <!-- Transaction List Container -->
      <div id="transactionList" class="transaction-list">
        <!-- Initial Skeleton Loading -->
        <div class="card skeleton-card skeleton"></div>
        <div class="card skeleton-card skeleton"></div>
        <div class="card skeleton-card skeleton"></div>
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state hidden">
        <i class="fa-solid fa-receipt empty-icon"></i>
        <div class="empty-title">এখনও কোনো Transaction নেই</div>
        <div class="empty-sub">আপনার Wallet ব্যবহার করে লেনদেন করলে সেগুলো এখানে দেখা যাবে।</div>
      </div>

      <!-- Pagination / Load More -->
      <button id="btnLoadMore" class="btn-load-more hidden" onclick="loadMoreTransactions()">
        আরও দেখুন <i class="fa-solid fa-chevron-down" style="margin-left: 6px;"></i>
      </button>
    </section>

  </main>

  <!-- Firebase v10 Modular SDK Execution -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { 
      getFirestore, doc, onSnapshot, collection, query, where, limit 
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
  apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE",
  authDomain: "ghotimarket.firebaseapp.com",
  databaseURL: "https://ghotimarket-default-rtdb.firebaseio.com",
  projectId: "ghotimarket",
  storageBucket: "ghotimarket.firebasestorage.app",
  messagingSenderId: "481257644093",
  appId: "1:481257644093:web:0dfc3699d6b3c86afeca54",
  measurementId: "G-4SR8V2EKC1"
};

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Global App State
    let currentUser = null;
    let userUnsubscribe = null;
    let txUnsubscribe = null;
    let currentTxLimit = 20;

    // Toast Alert Helper
    window.showToast = function(message, type = 'error') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      
      const icon = type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check';
      toast.innerHTML = `<i class="fa-solid ${icon}"></i><span>${message}</span>`;
      
      container.appendChild(toast);
      setTimeout(() => {
        toast.remove();
      }, 4000);
    };

    // Authenticated Guard & State Listener
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        // Redirect to Login if unauthenticated
        window.location.href = "login.html";
      } else {
        currentUser = user;
        initRealtimeListeners(user.uid);
      }
    });

    // Initialize Live Listeners
    function initRealtimeListeners(uid) {
      listenToUserProfile(uid);
      listenToTransactions(uid, currentTxLimit);
    }

    // 1. Live User Profile Listener
    function listenToUserProfile(uid) {
      if (userUnsubscribe) userUnsubscribe();

      const userDocRef = doc(db, "users", uid);
      userUnsubscribe = onSnapshot(userDocRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          renderWalletBalance(data.balance);
          renderAccountStatus(data.active, data.verified);
          renderSellerInfo(data, uid);
        } else {
          showToast("Seller প্রোফাইল তথ্য পাওয়া যায়নি।");
        }
      }, (error) => {
        console.error("User document error:", error);
        showToast("প্রোফাইল ডাটা লোড করা সম্ভব হয়নি।");
      });
    }

    // Render Wallet Balance
    function renderWalletBalance(balance) {
      const displayEl = document.getElementById("walletBalanceDisplay");
      const numBalance = Number(balance) || 0;
      const formattedBalance = numBalance.toLocaleString("bn-BD", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
      displayEl.innerHTML = `৳ ${formattedBalance}`;
    }

    // Render Account Status
    function renderAccountStatus(active, verified) {
      const statusActiveEl = document.getElementById("statusActive");
      const statusVerifiedEl = document.getElementById("statusVerified");

      if (active === true) {
        statusActiveEl.className = "status-badge badge-active";
        statusActiveEl.innerHTML = `🟢 Active`;
      } else {
        statusActiveEl.className = "status-badge badge-inactive";
        statusActiveEl.innerHTML = `🔴 Inactive`;
      }

      if (verified === true) {
        statusVerifiedEl.className = "status-badge badge-verified";
        statusVerifiedEl.innerHTML = `🟢 Verified`;
      } else {
        statusVerifiedEl.className = "status-badge badge-unverified";
        statusVerifiedEl.innerHTML = `🟠 Not Verified`;
      }
    }

    // Render Seller Information Card
    function renderSellerInfo(data, uid) {
      const avatarContainer = document.getElementById("sellerAvatarContainer");
      const shopNameEl = document.getElementById("sellerShopName");
      const metaEl = document.getElementById("sellerMeta");
      const uidEl = document.getElementById("sellerUid");

      const shopName = data.shopName || data.name || "Shop Name N/A";
      const username = data.username ? `@${data.username}` : '';
      const email = data.email || "";

      shopNameEl.textContent = shopName;
      metaEl.textContent = [username, email].filter(Boolean).join(" • ");
      uidEl.textContent = `UID: ${uid}`;

      if (data.shopLogo) {
        avatarContainer.innerHTML = `<img src="${data.shopLogo}" alt="Shop Logo" class="seller-avatar">`;
      } else {
        const firstLetter = shopName.charAt(0).toUpperCase() || "S";
        avatarContainer.innerHTML = `<div class="seller-avatar">${firstLetter}</div>`;
      }
    }

    // 2. Live Transactions Listener
    function listenToTransactions(uid, fetchLimit) {
      if (txUnsubscribe) txUnsubscribe();

      const txCollectionRef = collection(db, "users_transection");
      
      // Query filtering strictly by currentUser.uid
      const q = query(
        txCollectionRef,
        where("userId", "==", uid),
        limit(fetchLimit)
      );

      txUnsubscribe = onSnapshot(q, (snapshot) => {
        let transactions = [];
        snapshot.forEach((doc) => {
          transactions.push({ id: doc.id, ...doc.data() });
        });

        // Safe Client-side Descending Sort (Handles Timestamp, Date, string, null)
        transactions.sort((a, b) => getSafeTime(b.createdAt) - getSafeTime(a.createdAt));

        renderTransactions(transactions);
      }, (error) => {
        console.error("Transaction history error:", error);
        showToast("Transaction History লোড করা সম্ভব হয়নি।");
      });
    }

    // Extract Safe Milliseconds from createdAt field
    function getSafeTime(createdAt) {
      if (!createdAt) return 0;
      if (typeof createdAt.toDate === 'function') {
        return createdAt.toDate().getTime();
      }
      if (createdAt instanceof Date) {
        return createdAt.getTime();
      }
      if (typeof createdAt === 'number') {
        return createdAt;
      }
      if (typeof createdAt === 'string') {
        const parsed = new Date(createdAt).getTime();
        return isNaN(parsed) ? 0 : parsed;
      }
      return 0;
    }

    // Format Timestamp into Readable Bengali Date Format
    function formatBengaliDate(createdAt) {
      const timeMs = getSafeTime(createdAt);
      if (!timeMs) return "তারিখ পাওয়া যায়নি";

      const date = new Date(timeMs);
      
      const day = date.getDate();
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const month = monthNames[date.getMonth()];
      const year = date.getFullYear();

      let hours = date.getHours();
      const minutes = date.getMinutes().toString().padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12; // convert 0 to 12

      return `${day} ${month} ${year} • ${hours}:${minutes} ${ampm}`;
    }

    // Render Transaction List UI
    function renderTransactions(transactions) {
      const listContainer = document.getElementById("transactionList");
      const emptyState = document.getElementById("emptyState");
      const btnLoadMore = document.getElementById("btnLoadMore");

      listContainer.innerHTML = "";

      if (transactions.length === 0) {
        emptyState.classList.remove("hidden");
        btnLoadMore.classList.add("hidden");
        return;
      }

      emptyState.classList.add("hidden");

      transactions.forEach((tx) => {
        const txCard = document.createElement("div");
        txCard.className = "tx-card";

        // Determine Icon & Class based on Type
        let iconClass = "fa-money-bill-transfer";
        let iconStyle = "default";

        if (tx.type === "SUBSCRIPTION_BUY") {
          iconClass = "fa-cart-shopping";
          iconStyle = "buy";
        } else if (tx.type === "ADD_BALANCE") {
          iconClass = "fa-wallet";
          iconStyle = "add";
        } else if (tx.type === "REFUND") {
          iconClass = "fa-rotate-left";
          iconStyle = "refund";
        }

        // Amount Formatting (+/-)
        const rawAmount = Number(tx.amount) || 0;
        const isNegative = rawAmount < 0;
        const formattedAmountStr = Math.abs(rawAmount).toLocaleString("bn-BD", {
          minimumFractionDigits: 2
        });

        const amountDisplay = isNegative 
          ? `<span class="tx-amount negative">- ৳${formattedAmountStr}</span>`
          : `<span class="tx-amount positive">+ ৳${formattedAmountStr}</span>`;

        // Safe Field Displays
        const packageName = tx.packageName || tx.type || "Transaction";
        const dateFormatted = formatBengaliDate(tx.createdAt);

        let detailsItemsHTML = '';

        if (tx.packageDays !== undefined && tx.packageDays !== null) {
          detailsItemsHTML += `
            <div class="tx-detail-item">
              <span class="tx-detail-label">Package Days</span>
              <span class="tx-detail-val">${tx.packageDays} দিন</span>
            </div>`;
        }

        if (tx.packagePrice !== undefined && tx.packagePrice !== null) {
          detailsItemsHTML += `
            <div class="tx-detail-item">
              <span class="tx-detail-label">Package Price</span>
              <span class="tx-detail-val">৳${tx.packagePrice}</span>
            </div>`;
        }

        if (tx.prevBalance !== undefined && tx.newBalance !== undefined) {
          detailsItemsHTML += `
            <div class="tx-detail-item">
              <span class="tx-detail-label">Balance Change</span>
              <span class="tx-detail-val">৳${tx.prevBalance} → ৳${tx.newBalance}</span>
            </div>`;
        }

        let noteHTML = '';
        if (tx.note) {
          noteHTML = `
            <div class="tx-note">
              <i class="fa-regular fa-comment-dots"></i>
              <span>${tx.note}</span>
            </div>`;
        }

        txCard.innerHTML = `
          <div class="tx-header">
            <div class="tx-type-container">
              <div class="tx-icon ${iconStyle}">
                <i class="fa-solid ${iconClass}"></i>
              </div>
              <div class="tx-title-area">
                <span class="tx-package-name">${packageName}</span>
                <span class="tx-type-label">${tx.type || 'TRANSACTION'}</span>
              </div>
            </div>
            ${amountDisplay}
          </div>

          ${detailsItemsHTML ? `<div class="tx-divider"></div><div class="tx-details-grid">${detailsItemsHTML}</div>` : ''}

          ${noteHTML}

          <div class="tx-footer">
            <span>${dateFormatted}</span>
            <span class="tx-status-tag"><i class="fa-solid fa-circle-check"></i> Completed</span>
          </div>
        `;

        listContainer.appendChild(txCard);
      });

      // Show / Hide Pagination
      if (transactions.length >= currentTxLimit) {
        btnLoadMore.classList.remove("hidden");
      } else {
        btnLoadMore.classList.add("hidden");
      }
    }

    // Load More Functionality
    window.loadMoreTransactions = function() {
      currentTxLimit += 20;
      if (currentUser) {
        listenToTransactions(currentUser.uid, currentTxLimit);
      }
    };
  </script>
</body>
</html>
