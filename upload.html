<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পণ্য আপলোড - ঘটি মার্কেট সেলার প্যানেল</title>
    <link rel="stylesheet" href="upload.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="seller-wrapper">
        <!-- Header -->
        <header class="seller-header">
            <div class="logo-area">
                <h1>ঘটি মার্কেট</h1>
                <span>সেলার প্যানেল</span>
            </div>
            <div class="seller-info">
                <span id="shopNameDisplay">লোড হচ্ছে...</span>
                <button id="logoutBtn" class="logout-btn">লগআউট</button>
            </div>
        </header>

        <!-- Main Form Container -->
        <main class="form-container">
            <div class="form-card">
                <h2>নতুন পণ্য যুক্ত করুন</h2>
                <p class="form-subtitle">আপনার পণ্যের সঠিক তথ্য প্রদান করুন</p>

                <form id="productUploadForm">
                    <!-- Product Name -->
                    <div class="input-group">
                        <label for="productName">পণ্যের নাম <span class="required">*</span></label>
                        <input type="text" id="productName" placeholder="যেমন: অরিজিনাল অ্যাপল আইফোন" required>
                    </div>

                    <!-- Category -->
                    <div class="input-group">
                        <label for="productCategory">ক্যাটাগরি <span class="required">*</span></label>
                        <select id="productCategory" required>
                            <option value="">ক্যাটাগরি নির্বাচন করুন</option>
                        </select>
                    </div>

                    <!-- Description -->
                    <div class="input-group">
                        <label for="productDescription">পণ্যের বিবরণ <span class="required">*</span></label>
                        <textarea id="productDescription" rows="4" placeholder="পণ্যের বিস্তারিত বিবরণ লিখুন..." required></textarea>
                    </div>

                    <!-- Pricing Row -->
                    <div class="price-row">
                        <div class="input-group">
                            <label for="productPrice">বর্তমান মূল্য (টাকা) <span class="required">*</span></label>
                            <input type="number" id="productPrice" placeholder="৮৫০০০" min="0" required>
                        </div>
                        <div class="input-group">
                            <label for="productOldPrice">পূর্বের মূল্য (টাকা)</label>
                            <input type="number" id="productOldPrice" placeholder="৯০০০০" min="0">
                        </div>
                    </div>

                    <!-- Images Upload Section -->
                    <div class="images-section">
                        <label>পণ্যের ছবি (সর্বোচ্চ ২টি) <span class="required">*</span></label>
                        <p class="instruction-text">ছবি স্বয়ংক্রিয়ভাবে রিসাইজ, ওয়েিপি ফরম্যাট এবং ওয়াটারমার্ক যুক্ত হবে।</p>
                        
                        <div class="image-upload-grid">
                            <div class="image-box">
                                <input type="file" id="image1" accept="image/*" class="file-input" required>
                                <label for="image1" class="file-label" id="labelImage1">
                                    <span>+ ছবি ১ আপলোড</span>
                                </label>
                            </div>
                            <div class="image-box">
                                <input type="file" id="image2" accept="image/*" class="file-input">
                                <label for="image2" class="file-label" id="labelImage2">
                                    <span>+ ছবি ২ (ঐচ্ছিক)</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Keywords System -->
                    <div class="input-group">
                        <label>কীওয়ার্ড (সর্বোচ্চ ৫০টি)</label>
                        <div class="keyword-input-wrapper">
                            <input type="text" id="keywordInput" placeholder="একটি করে কীওয়ার্ড লিখে যোগ করুন">
                            <button type="button" id="addKeywordBtn">যোগ করুন</button>
                        </div>
                        <div id="keywordTagsContainer" class="keyword-tags"></div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="submitProductBtn" class="submit-btn">পণ্য প্রকাশ করুন</button>
                </form>
            </div>
        </main>
    </div>

    <!-- Custom Popup Modal -->
    <div id="customPopup" class="popup-overlay hidden">
        <div class="popup-box">
            <div id="popupIcon" class="popup-icon"></div>
            <h3 id="popupTitle">সতর্কবার্তা</h3>
            <p id="popupMessage">বার্তা এখানে প্রদর্শিত হবে।</p>
            <button id="popupCloseBtn" class="popup-btn">ঠিক আছে</button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner-box">
            <div class="spinner"></div>
            <p id="loadingText">প্রক্রিয়াধীন রয়েছে...</p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module" src="upload.js"></script>
</body>
</html>
