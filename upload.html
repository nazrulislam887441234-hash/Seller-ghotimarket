<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Product | Ghoti Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
 <style>
    :root { 
      --orange: #FF6A00; 
      --orange-dark: #E55A00;
      --green: #22c55e; 
      --red: #e11d48; 
      --bg: #FFF8F3; 
      --card: #fff; 
      --text: #1a1a1a; 
      --muted: #666; 
      --border: #FFE3D1;
      --shadow: 0 8px 30px rgba(255,106,0,0.08);
    }
    *{box-sizing:border-box;}
    body { 
      font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Hind Siliguri', sans-serif; 
      background: var(--bg); 
      margin: 0; 
      padding: 0; 
      color: var(--text);
      padding-bottom: 80px;
    }
    
    /* Lock Screen */
    #lock-screen { 
      position: fixed; inset: 0; background: var(--card); z-index: 9999; 
      display: flex; justify-content: center; align-items: center; 
      flex-direction: column; gap:10px;
    }
    #lock-screen i{color:var(--orange);}

    .container { 
      max-width: 600px; 
      margin: 0 auto; 
      background: var(--card); 
      padding: 20px; 
      border-radius: 0;
      box-shadow: none;
    }
    @media(min-width:768px){
      .container{margin:20px auto;border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--border);}
    }

    /* Warning */
    .warning-box { 
      background: #FEF2F2; 
      border: 1.5px solid #FECACA; 
      color: var(--red); 
      padding: 14px; 
      border-radius: 12px; 
      font-size: 13px; 
      margin-bottom: 20px; 
      text-align: center; 
      font-weight: 700;
      display:flex;align-items:center;gap:8px;justify-content:center;
    }
    .warning-box i{font-size:16px;}

    h2 { 
      text-align: center; 
      color: var(--orange); 
      margin-bottom: 25px; 
      font-size: 22px;
      font-weight: 800;
      display:flex;align-items:center;justify-content:center;gap:10px;
    }

    /* Form */
    .form-group { margin-bottom: 18px; }
    label { 
      display: block; 
      margin-bottom: 8px; 
      font-weight: 700; 
      font-size: 14px; 
      color: var(--text); 
    }
    input, textarea, select { 
      width: 100%; 
      padding: 15px; 
      border: 1.5px solid var(--border); 
      border-radius: 12px; 
      font-size: 15px; 
      background: #fff;
      outline: none; 
      transition: 0.2s;
      font-family: inherit;
    }
    select { 
      cursor: pointer; 
      appearance: none; 
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FF6A00' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); 
      background-repeat: no-repeat; 
      background-position: right 15px center; 
      background-size: 18px; 
      padding-right: 40px;
    }
    input:focus, textarea:focus, select:focus { 
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255,106,0,0.1);
    }
    textarea{min-height:100px;resize:vertical;}

    /* Price Row */
    .price-row{display:flex;gap:10px;}
    .price-row > div{flex:1;}
    .price-tip{font-size:12px;color:var(--orange-dark);font-weight:600;margin-top:8px;display:flex;align-items:center;gap:5px;}

    /* Image Upload */
    .img-grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 12px; 
      margin-bottom: 15px; 
    }
    .img-box { 
      background: var(--orange-light); 
      border: 2px dashed var(--border); 
      border-radius: 14px; 
      height: 110px; 
      display: flex; 
      flex-direction:column;
      align-items: center; 
      justify-content: center; 
      position: relative; 
      overflow: hidden;
      color:var(--muted);
      font-size:12px;
      gap:5px;
    }
    .img-box i{font-size:22px;color:var(--orange);}
    .img-box input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
    .img-box img { width: 100%; height: 100%; object-fit: cover; display: none; position:absolute;inset:0; }

    /* Keywords */
    .kw-box { 
      background: var(--orange-light); 
      padding: 15px; 
      border-radius: 14px; 
      border: 1px solid var(--border); 
    }
    .kw-input-row{display:flex;gap:8px;}
    .kw-input-row button{
      background:var(--orange); color:white; border:none; padding:0 18px; 
      border-radius:10px;font-weight:700;cursor:pointer;
    }
    #kwList { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
    .keyword-tag { 
      background: var(--orange); 
      color: white; 
      padding: 6px 14px; 
      border-radius: 20px; 
      font-size: 13px; 
      font-weight:600;
      display: flex; 
      align-items: center; 
      gap: 6px; 
    }
    .keyword-tag i{cursor:pointer;font-size:12px;}

    /* Button */
    .up-btn { 
      width: 100%; 
      padding: 17px; 
      background: var(--green); 
      color: white; 
      border: none; 
      border-radius: 14px; 
      font-weight: 800; 
      font-size: 17px; 
      margin-top: 20px; 
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(34,197,94,0.25);
      display:flex;align-items:center;justify-content:center;gap:8px;
    }
    .up-btn:disabled { background: #ccc; box-shadow:none; }

    .back-link { 
      display: block; 
      text-align: center; 
      margin-top: 18px; 
      color: var(--muted); 
      text-decoration: none; 
      font-size: 14px;
      font-weight:600;
    }
    .back-link i{margin-right:5px;}
</style>
</head>
<body>
    <div id="lock-screen">
        <div style="text-align: center;">
            <i class="fas fa-spinner fa-spin" style="font-size: 40px; color: var(--accent);"></i>
            <p>সিকিউরিটি চেক করা হচ্ছে...</p>
        </div>
    </div>

<div class="container">
    <div class="warning-box">সতর্কতা: কেউ যদি সঠিক দামের চেয়ে কম লিখেন তবে উনার একাউন্ট সারাজীবনের জন্য বন্ধ হয়ে যাবে এবং আর কখনো একাউন্ট খুলতে পারবেন না। জনস্বার্থে এই উদ্যোগ।</div>
    <h2><i class="fas fa-cloud-upload-alt"></i> নতুন পণ্য যোগ করুন</h2>
    
    <div class="form-group"><label>পণ্যের নাম</label><input type="text" id="pName" placeholder="পণ্যের নাম লিখুন"></div>
    
    <div class="form-group">
        <label>ক্যাটাগরি নির্বাচন করুন</label>
        <select id="pCategory">
            <option value="">ক্যাটাগরি নির্বাচন করুন</option>
            <!-- Categories will load here -->
        </select>
    </div>

    <div class="form-group"><label>বিস্তারিত বর্ণনা</label><textarea id="pDesc" placeholder="বিস্তারিত বর্ণনা লিখুন"></textarea></div>
  <div class="form-group">
    <label>দাম (৳)</label>

    <div style="display:flex;gap:10px;">
        <div style="flex:1;">
            <input type="number" id="pPrice" placeholder="বর্তমান দাম লিখুন">
        </div>

        <div style="flex:1;">
            <input type="number" id="oldPrice" placeholder="আগের দাম লিখুন">
        </div>
    </div>

    <small style="display:block;margin-top:8px;color:#e67e22;font-weight:600;">
        💡 টিপস: আগের দামের জায়গায় পণ্যের মূল দামের চেয়ে একটু বেশি লিখুন।
    </small>
</div>
    
    <label>পণ্যর ছবি (সর্বোচ্চ ২টি)</label>
    <div class="img-grid">
        <div class="img-box" id="box1"><i class="fas fa-camera"></i><img id="view1"><input type="file" id="img1" accept="image/*" onchange="previewImg(this, 'view1', 'box1')"></div>
        <div class="img-box" id="box2"><i class="fas fa-camera"></i><img id="view2"><input type="file" id="img2" accept="image/*" onchange="previewImg(this, 'view2', 'box2')"></div>
    </div>
    
    <div class="form-group">
        <label>কিওয়ার্ড আবশ্যক - Add বাটনে ক্লিক করুন)</label>
        <div class="kw-box">
            <div style="display: flex; gap: 5px;"><input type="text" id="kwInput" placeholder="উদা: পাঞ্জাবি"><button onclick="addKW()" style="background:var(--primary); color:white; border:none; padding:0 15px; border-radius:8px;">Add</button></div>
            <div id="kwList"></div>
        </div>
    </div>
    <button onclick="uploadProduct()" id="upBtn" class="up-btn">আপলোড শুরু করুন</button>
    <a href="dashboard.html" class="back-link">ফিরে যান</a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, getDocs, collection, addDoc, runTransaction, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const db = getFirestore(initializeApp({ apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE", projectId: "ghotimarket" }));
    const auth = getAuth();
    const imgbbKey = "e1da51b6d309ac3a5a235b5088ebc334";
    let keywords = [];
    let userData = null;

    // Load Categories from Firestore
    async function loadCategories() {
        const catSelect = document.getElementById('pCategory');
        try {
            const querySnapshot = await getDocs(collection(db, "categories"));
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const option = document.createElement('option');
                option.value = data.slug; // save slug in value
                option.textContent = data.categoryName;
                catSelect.appendChild(option);
            });
        } catch (error) {
            console.error("Error loading categories:", error);
        }
    }

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const userSnap = await getDoc(doc(db, "users", user.uid));
            userData = userSnap.data();
            if (!userData || userData.profileUnlockedUntil < Date.now()) window.location.href = "locked.html";
            else {
                document.getElementById('lock-screen').style.display = 'none';
                loadCategories(); // Fetch categories when authorized
            }
        } else window.location.href = "login.html";
    });

    window.previewImg = (input, viewId, boxId) => {
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById(viewId).src = e.target.result;
                document.getElementById(viewId).style.display = 'block';
                document.getElementById(boxId).style.border = 'none';
            };
            reader.readAsDataURL(file);
        }
    };

    const convertToWebP = (file) => {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const maxWidth = 1200;
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) { height = (height * maxWidth) / width; width = maxWidth; }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob((blob) => { resolve(new File([blob], "image.webp", { type: "image/webp" })); }, "image/webp", 0.8);
                };
            };
        });
    };

    window.addKW = () => {
        const val = document.getElementById('kwInput').value.trim();
        if (val && keywords.length < 50) { keywords.push(val.toLowerCase()); renderKeywords(); document.getElementById('kwInput').value = ""; }
    };

function generateSlug(name) {
    const base = name
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9\u0980-\u09FF\s-]/g, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-");

    const numbers = () =>
        Math.floor(Math.random() * 9 + 1).toString() +
        Math.floor(Math.random() * 9 + 1).toString();

    const letters = () =>
        String.fromCharCode(97 + Math.floor(Math.random() * 26)) +
        String.fromCharCode(97 + Math.floor(Math.random() * 26));

    return `${base}-${numbers()}${letters()}`;
}


    function renderKeywords() {
        document.getElementById('kwList').innerHTML = keywords.map((k, i) => `<div class="keyword-tag">${k} <i class="fas fa-times" onclick="removeKW(${i})"></i></div>`).join('');
    }

    window.removeKW = (index) => { keywords.splice(index, 1); renderKeywords(); };

    window.uploadProduct = async () => {
        const btn = document.getElementById('upBtn');
        const user = auth.currentUser;
        const userRef = doc(db, "users", user.uid);
        
        const name = document.getElementById('pName').value.trim();
        const slug = generateSlug(name);       
        const price = parseInt(document.getElementById('pPrice').value);
        const oldPrice = parseInt(document.getElementById('oldPrice').value) || price; 
        const desc = document.getElementById('pDesc').value.trim();
        const catSelect = document.getElementById('pCategory');
        const categorySlug = catSelect.value;
        const categoryName = catSelect.options[catSelect.selectedIndex].text;
        const f1 = document.getElementById('img1').files[0];

        // ১. ক্যাটাগরি ভ্যালিডেশন
        if (!categorySlug) {
            alert("দয়া করে একটি ক্যাটাগরি নির্বাচন করুন");
            return;
        }

        // আজকের তারিখ (YYYY-MM-DD ফরম্যাট)
        const today = new Date().toISOString().split('T')[0];

        try {
            await runTransaction(db, async (transaction) => {
                const userDoc = await transaction.get(userRef);
                const data = userDoc.data();
                
                let currentCount = (data.lastUploadDate === today) ? (data.todayUploads || 0) : 0;

                if (currentCount >= 5) {
                    throw new Error("LIMIT_EXCEEDED");
                }

                // ইনপুট ভ্যালিডেশন
                if (!name || !price || !f1 || keywords.length === 0) throw new Error("INVALID_INPUT");

                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> আপলোড হচ্ছে...';

                // ছবি আপলোড ও প্রোসেসিং
                const files = [f1, document.getElementById('img2').files[0]].filter(f => f);
                const imgUrls = [];
                for (let file of files) {
                    const webpFile = await convertToWebP(file);
                    const formData = new FormData(); formData.append("image", webpFile);
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${imgbbKey}`, { method: "POST", body: formData });
                    const json = await res.json();
                    if(json.success) imgUrls.push(json.data.url);
                }

                // প্রোডাক্ট সেভ (ক্যাটাগরি সহ)
             await addDoc(collection(db, "products"), {
    name,
    slug,
    description: desc,
    price,
    oldPrice,
    keywords,
    images: imgUrls,
    categoryName,
    categorySlug,
    sellerId: user.uid,
    shopName: data.shopName,
    whatsapp: data.whatsapp,
    active: true,
    createdAt: Date.now()
});

                // ইউজার লিমিট আপডেট
                transaction.update(userRef, {
                    todayUploads: currentCount + 1,
                    lastUploadDate: today
                });
            });

            alert("পণ্যটি সফলভাবে যোগ করা হয়েছে!");
            window.location.href = "dashboard.html";

        } catch (err) {
            if (err.message === "LIMIT_EXCEEDED") alert("আজকের আপলোড সীমা (৫টি) শেষ!");
            else if (err.message === "INVALID_INPUT") alert("সব তথ্য সঠিকভাবে পূরণ করুন!");
            else {
                console.error(err);
                alert("আপলোড সমস্যা হয়েছে।");
            }
            
            btn.disabled = false;
            btn.innerText = "আপলোড শুরু করুন";
        }
    };
</script>

</body>
</html>
