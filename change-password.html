<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | Ghoti Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #2c3e50; 
            --accent: #3498db; 
            --success: #2ecc71; 
            --danger: #e74c3c; 
            --bg: #f8f9fa; 
        }
        body { 
            font-family: 'Hind Siliguri', sans-serif; 
            background: var(--bg); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .container { 
            width: 90%; 
            max-width: 400px; 
            background: white; 
            padding: 30px; 
            border-radius: 25px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.05); 
            text-align: center; 
        }
        h2 { color: var(--primary); margin: 0 0 25px; font-size: 24px; }
        
        .input-group { 
            position: relative; 
            margin-bottom: 18px; 
            text-align: left; 
        }
        .input-group label { 
            display: block; 
            margin-bottom: 6px; 
            color: #555; 
            font-size: 14px; 
        }
        .input-field { 
            width: 100%; 
            padding: 12px 40px 12px 15px; 
            border: 1px solid #ddd; 
            border-radius: 12px; 
            font-size: 16px; 
            outline: none; 
            box-sizing: border-box; 
            transition: 0.3s; 
        }
        .input-field:focus { border-color: var(--accent); }
        .input-group i { 
            position: absolute; 
            right: 15px; 
            top: 38px; 
            color: #aaa; 
            cursor: pointer; 
        }
        
        .submit-btn { 
            width: 100%; 
            padding: 14px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-top: 10px;
        }
        .submit-btn:hover { background: #1a252f; }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="container">
        <h2>পাসওয়ার্ড পরিবর্তন</h2>
        
        <form id="passwordForm">
            <div class="input-group">
                <label>আপনার একাউন্টের ইমেইল</label>
                <input type="email" id="userEmail" class="input-field" placeholder="example@mail.com" required>
            </div>

            <div class="input-group">
                <label>বর্তমান পাসওয়ার্ড</label>
                <input type="password" id="currentPassword" class="input-field" placeholder="বর্তমান পাসওয়ার্ড দিন" required>
                <i class="fas fa-eye" onclick="togglePass('currentPassword', this)"></i>
            </div>
            
            <div class="input-group">
                <label>নতুন পাসওয়ার্ড</label>
                <input type="password" id="newPassword" class="input-field" placeholder="নূন্যতম ৬ অক্ষরের পাসওয়ার্ড" required>
                <i class="fas fa-eye" onclick="togglePass('newPassword', this)"></i>
            </div>

            <div class="input-group">
                <label>নতুন পাসওয়ার্ডটি পুনরায় দিন</label>
                <input type="password" id="confirmPassword" class="input-field" placeholder="আবারও নতুন পাসওয়ার্ডটি দিন" required>
                <i class="fas fa-eye" onclick="togglePass('confirmPassword', this)"></i>
            </div>
            
            <button type="submit" id="btnSubmit" class="submit-btn">পাসওয়ার্ড আপডেট করুন</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, updatePassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // ফায়ারবেস কনফিগ
        const firebaseConfig = { 
            apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE", 
            authDomain: "ghotimarket.firebaseapp.com",
            projectId: "ghotimarket" 
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // পাসওয়ার্ড হাইড/শো লজিক
        window.togglePass = (id, icon) => {
            const field = document.getElementById(id);
            if(field.type === "password") {
                field.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                field.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        // ফর্ম সাবমিট হ্যান্ডলার
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const inputEmail = document.getElementById('userEmail').value.trim();
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btnSubmit = document.getElementById('btnSubmit');
            
            // সিকিউরিটি চেক ১: নতুন পাসওয়ার্ড ২ বার ম্যাচ করছে কি না
            if (newPassword !== confirmPassword) {
                alert("দুঃখিত! নতুন পাসওয়ার্ড এবং কনফার্ম পাসওয়ার্ড দুটি মেলেনি।");
                return;
            }

            // সিকিউরিটি চেক ২: পাসওয়ার্ড লেন্থ চেক
            if (newPassword.length < 6) {
                alert("নতুন পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে!");
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerText = "আপডেট হচ্ছে...";

            try {
                // ১. ইউজার লগইন থাকুক বা না থাকুক, ইনপুট দেওয়া মেইল ও পাসওয়ার্ড দিয়ে ব্যাকএন্ডে সাইন-ইন করানো হচ্ছে
                const userCredential = await signInWithEmailAndPassword(auth, inputEmail, currentPassword);
                const user = userCredential.user;
                
                // ২. সাইন-ইন সফল হলে সরাসরি নতুন পাসওয়ার্ড আপডেট করা হচ্ছে
                await updatePassword(user, newPassword);
                
                alert("অভিনন্দন! আপনার পাসওয়ার্ড সফলভাবে পরিবর্তন হয়েছে।");
                document.getElementById('passwordForm').reset(); // ফর্ম ফাঁকা হবে, কোনো রিডাইরেক্ট হবে না

            } catch (error) {
                console.error(error);
                // ফায়ারবেস এরর কোড হ্যান্ডলিং
                if (error.code === "auth/invalid-credential" || error.code === "auth/wrong-password" || error.code === "auth/user-not-found") {
                    alert("দুঃখিত! আপনার দেওয়া ইমেইল অথবা বর্তমান পাসওয়ার্ডটি ভুল।");
                } else if (error.code === "auth/requires-recent-login") {
                    alert("নিরাপত্তার স্বার্থে অনুগ্রহ করে পেজটি রিফ্রেশ করে আবার চেষ্টা করুন।");
                } else {
                    alert("পাসওয়ার্ড পরিবর্তন করা যায়নি! আবার চেষ্টা করুন।");
                }
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = "পাসওয়ার্ড আপডেট করুন";
            }
        });
    </script>
</body>
</html>
