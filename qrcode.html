<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHOTI MARKET - My QR Card</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- QRCode.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  :root {
    --orange: #FF6A00;
    --orange-light: #FFF4EC;
    --white: #FFFFFF;
    --text: #1A1A1A;
    --text-light: #666666;
    --shadow: rgba(255, 106, 0, 0.15);
  }

    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Hind Siliguri', sans-serif;
    background: linear-gradient(135deg, #FFF4EC 0%, #FFFFFF 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  .container {
    width: 95%;
    max-width: 360px;
    animation: fadeIn 0.8s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .card {
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(20px);
    border-radius: 30px;
    padding: 30px 25px;
    box-shadow: 0 20px 60px var(--shadow);
    border: 1px solid rgba(255, 106, 0, 0.1);
    animation: float 3s ease-in-out infinite;
    text-align: center;
  }

  .logo {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    margin: 0 auto 15px;
    border: 3px solid var(--orange);
    object-fit: cover;
    background: var(--orange-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: var(--orange);
  }

  .shop-name {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 5px;
  }

  .username {
    font-size: 15px;
    color: var(--orange);
    font-weight: 600;
    margin-bottom: 20px;
  }

  .uid {
    font-size: 13px;
    color: var(--text-light);
    margin-bottom: 20px;
    font-family: monospace;
  }

  .qr-wrapper {
    background: var(--white);
    padding: 15px;
    border-radius: 20px;
    display: inline-block;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    margin-bottom: 15px;
    animation: scaleIn 0.6s ease-out 0.3s both;
  }

  @keyframes scaleIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  #qrcode canvas {
    border-radius: 12px;
  }

  .scan-text {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 5px;
  }

  .shop-link {
    font-size: 12px;
    color: var(--text-light);
    word-break: break-all;
    margin-bottom: 25px;
  }

  .powered {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 20px;
  }

  .powered i {
    color: var(--orange);
  }

  .download-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--orange) 0%, #FF8533 100%);
    color: var(--white);
    border: none;
    padding: 16px;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 600;
    font-family: 'Hind Siliguri', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s;
  }

  .download-btn:active {
    transform: scale(0.97);
  }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    transform: scale(0);
    animation: ripple 0.6s linear;
  }

  @keyframes ripple {
    to { transform: scale(4); opacity: 0; }
  }

  .error {
    background: #FFE5E5;
    color: #D32F2F;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    font-weight: 500;
  }

  .loader {
    text-align: center;
    color: var(--text-light);
  }
</style>
</head>
<body>

<div class="container">
  <div class="card" id="qrCard">
    <div id="content">
      <div class="loader"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>
    </div>
  </div>
</div>

<script type="module">
  // Firebase v10 Modular
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // আপনার Firebase Config এখানে বসান
  const firebaseConfig = {
  apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE",
  authDomain: "ghotimarket.firebaseapp.com",
  databaseURL: "https://ghotimarket-default-rtdb.firebaseio.com",
  projectId: "ghotimarket",
  storageBucket: "ghotimarket.firebasestorage.app",
  messagingSenderId: "481257644093",
  appId: "1:481257644093:web:0dfc3699d6b3c86afeca54"
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const contentDiv = document.getElementById('content');

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }

    try {
      const userRef = doc(db, "users", user.uid);
      const userSnap = await getDoc(userRef);

      if (!userSnap.exists()) throw new Error("User data not found");

      const data = userSnap.data();
      const shopName = data.shopName || "My Shop";
      const shopLogo = data.shopLogo || "";
      const username = data.username || "";
      const uid = user.uid;

      const qrLink = username 
        ? `https://ghotimarket.com/seller?@${username}` 
        : uid;
      
      const fileName = username ? `@${username}-qr.png` : `${uid}-qr.png`;

      contentDiv.innerHTML = `
        <div class="logo">
          ${shopLogo ? `<img src="${shopLogo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : `<i class="fa-solid fa-store"></i>`}
        </div>
        <h1 class="shop-name">${shopName}</h1>
        ${username ? `<p class="username">@${username}</p>` : `<p class="uid">UID: ${uid.substring(0,8)}...</p>`}
        
        <div class="qr-wrapper">
          <div id="qrcode"></div>
        </div>

        <p class="scan-text">Scan to Visit Shop</p>
        <p class="shop-link">${qrLink}</p>

        <div class="powered">
          <i class="fa-solid fa-bag-shopping"></i>
          Powered by GHOTI MARKET
        </div>

        <button class="download-btn" id="downloadBtn">
          <i class="fa-solid fa-download"></i>
          Download QR Card
        </button>
      `;

      // QR Generate
      new QRCode(document.getElementById("qrcode"), {
        text: qrLink,
        width: 220,
        height: 220,
        colorDark: "#1A1A1A",
        colorLight: "#FFFFFF",
        correctLevel: QRCode.CorrectLevel.H
      });

      // Download Button
      document.getElementById('downloadBtn').addEventListener('click', function(e) {
        // Ripple effect
        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        ripple.style.left = e.offsetX + 'px';
        ripple.style.top = e.offsetY + 'px';
        this.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);

        // Download Card
        html2canvas(document.getElementById('qrCard'), {
          backgroundColor: '#FFFFFF',
          scale: 2
        }).then(canvas => {
          const link = document.createElement('a');
          link.download = fileName;
          link.href = canvas.toDataURL('image/png');
          link.click();
        });
      });

    } catch (error) {
      contentDiv.innerHTML = `
        <div class="error">
          <i class="fa-solid fa-circle-exclamation"></i><br>
          ডেটা লোড করতে সমস্যা হয়েছে।<br>
          পরে আবার চেষ্টা করুন।
        </div>
      `;
      console.error(error);
    }
  });
</script>

</body>
</html>
