<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Account Setup — GHOTI MARKET</title>

<link rel="icon" href="https://seller.ghotimarket.com/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Hind Siliguri",sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at top left,#ffeadc,transparent 35%),
        linear-gradient(135deg,#fff,#fff7f2);
}

.card{
    width:100%;
    max-width:430px;
    background:#fff;
    border-radius:28px;
    padding:42px 30px;
    text-align:center;
    box-shadow:0 25px 70px rgba(0,0,0,.08);
    border:1px solid #ffe4d3;
}

.logo{
    width:75px;
    height:75px;
    padding:10px;
    border-radius:21px;
    margin:0 auto 22px;
    background:#fff3eb;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.icon{
    width:54px;
    height:54px;
    margin:0 auto 18px;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ff6a00;
    background:#fff1e8;
}

.icon svg{
    width:27px;
    height:27px;
}

h1{
    font-size:26px;
    color:#171717;
}

p{
    margin-top:10px;
    color:#777;
    line-height:1.7;
    font-size:14px;
}

.loader{
    margin:25px auto 0;
    width:35px;
    height:35px;
    border:4px solid #ffe0cc;
    border-top-color:#ff6a00;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">
        <img src="https://seller.ghotimarket.com/logo.png">
    </div>

    <div class="icon">
        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
            <rect x="4" y="10" width="16" height="10" rx="2"/>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>
    </div>

    <h1>অ্যাকাউন্ট যাচাই করা হচ্ছে</h1>

    <p>
        আপনার GHOTI MARKET অ্যাকাউন্টের
        তথ্য যাচাই করা হচ্ছে।
    </p>

    <div class="loader"></div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


const firebaseConfig = {
    apiKey:"AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE",
    authDomain:"ghotimarket.firebaseapp.com",
    projectId:"ghotimarket"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


onAuthStateChanged(auth, async (user) => {

    if(!user){
        window.location.replace("/signup");
        return;
    }

    try{

        const ref = doc(db,"users",user.uid);
        const snap = await getDoc(ref);

        if(snap.exists()){

            window.location.replace("/dashboard");

        }else{

            window.location.replace("/signup1");

        }

    }catch(error){

        console.error(error);

        window.location.replace("/signup1");

    }

});

</script>

</body>
</html>
