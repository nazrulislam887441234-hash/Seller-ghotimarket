<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Shop Information — GHOTI MARKET</title>

<link rel="icon" href="https://seller.ghotimarket.com/logo.png">

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Hind Siliguri",sans-serif;
    min-height:100vh;
    background:
        radial-gradient(circle at top left,#ffeadc,transparent 32%),
        linear-gradient(135deg,#fff,#fff8f4);
    color:#171717;
}

.wrapper{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:30px 16px 50px;
}

.top{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    width:64px;
    height:64px;
    padding:9px;
    background:#fff2e9;
    border-radius:18px;
    margin:0 auto 16px;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.progress{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:22px;
}

.step{
    width:35px;
    height:35px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#ffe7d8;
    color:#ff6a00;
    font-weight:700;
}

.step.active{
    background:#ff6a00;
    color:#fff;
}

.line{
    width:45px;
    height:3px;
    background:#ffe0cc;
    border-radius:10px;
}

h1{
    font-size:28px;
}

.subtitle{
    color:#777;
    font-size:14px;
    margin-top:6px;
}

.card{
    background:#fff;
    border:1px solid #ffe2d0;
    border-radius:25px;
    padding:27px;
    box-shadow:0 20px 60px rgba(0,0,0,.07);
}

.field{
    margin-bottom:21px;
}

label{
    display:block;
    font-weight:600;
    font-size:14px;
    margin-bottom:8px;
}

input,
textarea{
    width:100%;
    border:1px solid #e8e8e8;
    outline:none;
    background:#fafafa;
    border-radius:14px;
    padding:14px;
    font-family:inherit;
    font-size:15px;
    transition:.2s;
}

input{
    height:53px;
}

textarea{
    min-height:120px;
    resize:vertical;
}

input:focus,
textarea:focus{
    background:#fff;
    border-color:#ff6a00;
    box-shadow:0 0 0 4px rgba(255,106,0,.1);
}

.upload{
    border:1.5px dashed #ffc6a5;
    background:#fff9f5;
    border-radius:19px;
    padding:18px;
}

.upload-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
}

.upload-icon{
    width:45px;
    height:45px;
    border-radius:13px;
    background:#fff0e6;
    color:#ff6a00;
    display:flex;
    align-items:center;
    justify-content:center;
}

.upload-icon svg{
    width:23px;
    height:23px;
}

.upload-title{
    font-weight:700;
}

.upload-size{
    color:#888;
    font-size:12px;
}

.file{
    display:none;
}

.choose{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    min-height:48px;
    border-radius:12px;
    background:#ff6a00;
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}

.preview{
    display:none;
    margin-top:15px;
    border-radius:15px;
    overflow:hidden;
    background:#f5f5f5;
    position:relative;
}

.preview.show{
    display:block;
}

.preview.logo-preview{
    width:150px;
    height:150px;
    margin-left:auto;
    margin-right:auto;
}

.preview.banner-preview{
    aspect-ratio:16/9;
}

.preview img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.preview-status{
    margin-top:8px;
    text-align:center;
    font-size:12px;
    color:#777;
}

.next{
    width:100%;
    height:55px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#ff7a18,#ff6a00);
    color:#fff;
    font-family:inherit;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 12px 25px rgba(255,106,0,.2);
}

.next:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.modal-bg,
.loading{
    position:fixed;
    inset:0;
    z-index:100;
}

.modal-bg{
    background:rgba(0,0,0,.45);
    backdrop-filter:blur(7px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    opacity:0;
    visibility:hidden;
    transition:.2s;
}

.modal-bg.show{
    opacity:1;
    visibility:visible;
}

.modal{
    width:100%;
    max-width:380px;
    background:#fff;
    border-radius:23px;
    padding:27px;
    text-align:center;
}

.modal-icon{
    width:56px;
    height:56px;
    margin:auto;
    border-radius:17px;
    background:#fff1e8;
    color:#ff6a00;
    display:flex;
    align-items:center;
    justify-content:center;
}

.modal-icon svg{
    width:27px;
    height:27px;
}

.modal h2{
    margin-top:15px;
    font-size:21px;
}

.modal p{
    margin-top:7px;
    color:#777;
    line-height:1.7;
    font-size:14px;
}

.modal button{
    width:100%;
    height:47px;
    border:0;
    border-radius:12px;
    background:#ff6a00;
    color:#fff;
    font-family:inherit;
    font-weight:700;
    margin-top:20px;
}

.loading{
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
}

.loading.show{
    display:flex;
}

.loading-box{
    background:#fff;
    border-radius:20px;
    padding:28px 35px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.12);
}

.spinner{
    width:37px;
    height:37px;
    border:4px solid #ffe0cc;
    border-top-color:#ff6a00;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:auto;
}

.loading p{
    margin-top:13px;
    font-weight:600;
    font-size:14px;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

@media(max-width:500px){
    .card{
        padding:20px;
        border-radius:20px;
    }
}

</style>
</head>

<body>

<div class="wrapper">

<div class="top">

    <div class="logo">
        <img src="https://seller.ghotimarket.com/logo.png">
    </div>

    <div class="progress">
        <div class="step">1</div>
        <div class="line"></div>
        <div class="step active">2</div>
        <div class="line"></div>
        <div class="step">3</div>
    </div>

    <h1>Shop Information</h1>

    <div class="subtitle">
        আপনার অনলাইন শপের তথ্য দিন
    </div>

</div>


<div class="card">

<form id="form">

    <div class="field">

        <label>শপের নাম</label>

        <input
            id="shopName"
            type="text"
            placeholder="আপনার শপের নাম লিখুন"
            required
        >

    </div>


    <div class="field">

        <label>শপের ডেসক্রিপশন</label>

        <textarea
            id="shopDescription"
            placeholder="আপনার শপ সম্পর্কে সংক্ষেপে লিখুন..."
            required
        ></textarea>

    </div>


    <!-- LOGO -->

    <div class="field">

        <label>শপ লগো</label>

        <div class="upload">

            <div class="upload-head">

                <div class="upload-icon">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="3"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <path d="m21 15-5-5L5 21"/>
                    </svg>

                </div>

                <div>
                    <div class="upload-title">
                        Logo Upload
                    </div>

                    <div class="upload-size">
                        Auto Crop: 1:1 • Compress
                    </div>
                </div>

            </div>

            <input
                class="file"
                type="file"
                id="logoInput"
                accept="image/*"
            >

            <label class="choose" for="logoInput">
                লগো নির্বাচন করুন
            </label>

            <div
                class="preview logo-preview"
                id="logoPreview"
            >
                <img id="logoPreviewImg">
            </div>

            <div
                class="preview-status"
                id="logoStatus"
            ></div>

        </div>

    </div>


    <!-- BANNER -->

    <div class="field">

        <label>শপ ব্যানার</label>

        <div class="upload">

            <div class="upload-head">

                <div class="upload-icon">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2">
                        <rect x="3" y="4" width="18" height="16" rx="3"/>
                        <path d="m3 16 5-5 4 4 3-3 6 6"/>
                    </svg>

                </div>

                <div>
                    <div class="upload-title">
                        Banner Upload
                    </div>

                    <div class="upload-size">
                        16:9 • Auto Crop • Compress
                    </div>
                </div>

            </div>

            <input
                class="file"
                type="file"
                id="bannerInput"
                accept="image/*"
            >

            <label class="choose" for="bannerInput">
                ব্যানার নির্বাচন করুন
            </label>

            <div
                class="preview banner-preview"
                id="bannerPreview"
            >
                <img id="bannerPreviewImg">
            </div>

            <div
                class="preview-status"
                id="bannerStatus"
            ></div>

        </div>

    </div>


    <button
        class="next"
        id="nextBtn"
        type="submit"
    >
        পরের ধাপ
    </button>

</form>

</div>

</div>


<!-- MODAL -->

<div class="modal-bg" id="modal">

<div class="modal">

    <div class="modal-icon">

        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 8v4"/>
            <path d="M12 16h.01"/>
        </svg>

    </div>

    <h2 id="modalTitle">
        তথ্য প্রয়োজন
    </h2>

    <p id="modalText">
        অনুগ্রহ করে প্রয়োজনীয় তথ্য দিন।
    </p>

    <button onclick="closeModal()">
        ঠিক আছে
    </button>

</div>

</div>


<!-- LOADING -->

<div class="loading" id="loading">

<div class="loading-box">

    <div class="spinner"></div>

    <p id="loadingText">
        প্রস্তুত করা হচ্ছে...
    </p>

</div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


const firebaseConfig={
    apiKey:"AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE",
    authDomain:"ghotimarket.firebaseapp.com",
    projectId:"ghotimarket"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


const IMAGE_WORKER=
    "https://image-upload.ghotimarket.com";


let currentUser=null;


onAuthStateChanged(auth,async(user)=>{

    if(!user){

        location.replace("/signup");
        return;

    }

    currentUser=user;

    try{

        const snap=await getDoc(
            doc(db,"users",user.uid)
        );

        if(snap.exists()){

            location.replace("/dashboard");
            return;

        }

    }catch(error){

        console.error(error);

    }

});


const logoInput=
    document.getElementById("logoInput");

const bannerInput=
    document.getElementById("bannerInput");


let logoBlob=null;
let bannerBlob=null;


/* =========================
   IMAGE PROCESSOR
========================= */

function cropAndCompress(
    file,
    targetRatio,
    maxWidth,
    quality
){

    return new Promise((resolve,reject)=>{

        const reader=new FileReader();

        reader.onload=()=>{

            const img=new Image();

            img.onload=()=>{

                let sw=img.width;
                let sh=img.height;

                const sourceRatio=sw/sh;

                let sx=0;
                let sy=0;
                let sWidth=sw;
                let sHeight=sh;


                if(sourceRatio>targetRatio){

                    sWidth=sh*targetRatio;
                    sx=(sw-sWidth)/2;

                }else{

                    sHeight=sw/targetRatio;
                    sy=(sh-sHeight)/2;

                }


                let width=Math.round(sWidth);
                let height=Math.round(
                    width/targetRatio
                );


                if(width>maxWidth){

                    width=maxWidth;
                    height=Math.round(
                        width/targetRatio
                    );

                }


                const canvas=
                    document.createElement("canvas");

                canvas.width=width;
                canvas.height=height;


                const ctx=
                    canvas.getContext("2d");

                ctx.imageSmoothingEnabled=true;
                ctx.imageSmoothingQuality="high";


                ctx.drawImage(
                    img,
                    sx,
                    sy,
                    sWidth,
                    sHeight,
                    0,
                    0,
                    width,
                    height
                );


                canvas.toBlob(
                    blob=>{

                        if(!blob){

                            reject(
                                new Error(
                                    "Image process করা যায়নি।"
                                )
                            );

                            return;

                        }

                        resolve(blob);

                    },
                    "image/jpeg",
                    quality
                );

            };


            img.onerror=()=>{
                reject(
                    new Error(
                        "Image load করা যায়নি।"
                    )
                );
            };


            img.src=reader.result;

        };


        reader.onerror=()=>{
            reject(
                new Error(
                    "File read করা যায়নি।"
                )
            );
        };


        reader.readAsDataURL(file);

    });

}


/* =========================
   UPLOAD WORKER
========================= */

async function uploadImage(
    blob,
    filename
){

    const formData=new FormData();

    formData.append(
        "image",
        blob,
        filename
    );


    const response=await fetch(
        IMAGE_WORKER,
        {
            method:"POST",
            body:formData
        }
    );


    let result;

    try{

        result=await response.json();

    }catch{

        throw new Error(
            "Image upload server থেকে সঠিক response পাওয়া যায়নি।"
        );

    }


    if(
        !response.ok ||
        !result.success
    ){

        throw new Error(
            result.message ||
            "Image upload করা যায়নি।"
        );

    }


    return result.data.url;

}


/* =========================
   LOGO
========================= */

logoInput.addEventListener(
    "change",
    async(e)=>{

        const file=e.target.files[0];

        if(!file)return;


        if(!file.type.startsWith("image/")){

            showModal(
                "ভুল ফাইল",
                "শুধুমাত্র image নির্বাচন করুন।"
            );

            logoInput.value="";
            return;

        }


        try{

            setLoading(
                true,
                "Logo প্রস্তুত করা হচ্ছে..."
            );


            logoBlob=
                await cropAndCompress(
                    file,
                    1,
                    800,
                    .88
                );


            const previewUrl=
                URL.createObjectURL(
                    logoBlob
                );


            document.getElementById(
                "logoPreviewImg"
            ).src=previewUrl;


            document.getElementById(
                "logoPreview"
            ).classList.add("show");


            document.getElementById(
                "logoStatus"
            ).textContent=
                "Logo প্রস্তুত হয়েছে";


        }catch(error){

            console.error(error);

            showModal(
                "Logo প্রস্তুত করা যায়নি",
                error.message
            );

        }finally{

            setLoading(false);

        }

    }
);


/* =========================
   BANNER
========================= */

bannerInput.addEventListener(
    "change",
    async(e)=>{

        const file=e.target.files[0];

        if(!file)return;


        if(!file.type.startsWith("image/")){

            showModal(
                "ভুল ফাইল",
                "শুধুমাত্র image নির্বাচন করুন।"
            );

            bannerInput.value="";
            return;

        }


        try{

            setLoading(
                true,
                "Banner 16:9 করে প্রস্তুত করা হচ্ছে..."
            );


            bannerBlob=
                await cropAndCompress(
                    file,
                    16/9,
                    1600,
                    .88
                );


            const previewUrl=
                URL.createObjectURL(
                    bannerBlob
                );


            document.getElementById(
                "bannerPreviewImg"
            ).src=previewUrl;


            document.getElementById(
                "bannerPreview"
            ).classList.add("show");


            document.getElementById(
                "bannerStatus"
            ).textContent=
                "16:9 Banner প্রস্তুত হয়েছে";


        }catch(error){

            console.error(error);

            showModal(
                "Banner প্রস্তুত করা যায়নি",
                error.message
            );

        }finally{

            setLoading(false);

        }

    }
);


/* =========================
   FORM
========================= */

document.getElementById("form")
.addEventListener(
"submit",
async(e)=>{

    e.preventDefault();


    const shopName=
        document.getElementById(
            "shopName"
        ).value.trim();


    const shopDescription=
        document.getElementById(
            "shopDescription"
        ).value.trim();


    if(shopName.length<2){

        showModal(
            "শপের নাম প্রয়োজন",
            "অনুগ্রহ করে শপের নাম লিখুন।"
        );

        return;

    }


    if(shopDescription.length<5){

        showModal(
            "শপ ডেসক্রিপশন প্রয়োজন",
            "অনুগ্রহ করে শপ সম্পর্কে একটি ডেসক্রিপশন লিখুন।"
        );

        return;

    }


    if(!logoBlob){

        showModal(
            "শপ লগো প্রয়োজন",
            "অনুগ্রহ করে শপের লগো নির্বাচন করুন।"
        );

        return;

    }


    if(!bannerBlob){

        showModal(
            "শপ ব্যানার প্রয়োজন",
            "অনুগ্রহ করে শপের ব্যানার নির্বাচন করুন।"
        );

        return;

    }


    try{

        setLoading(
            true,
            "Shop Information সংরক্ষণ করা হচ্ছে..."
        );


        /* Upload logo */

        const shopLogoUrl=
            await uploadImage(
                logoBlob,
                "shop-logo.jpg"
            );


        setLoading(
            true,
            "Shop Banner আপলোড করা হচ্ছে..."
        );


        /* Upload banner */

        const shopBannerUrl=
            await uploadImage(
                bannerBlob,
                "shop-banner.jpg"
            );


        /* Local Storage */

        localStorage.setItem(
            "shopName",
            shopName
        );

        localStorage.setItem(
            "shopDescription",
            shopDescription
        );

        localStorage.setItem(
            "shopLogo",
            shopLogoUrl
        );

        localStorage.setItem(
            "shopBanner",
            shopBannerUrl
        );


        location.href="/signup3";


    }catch(error){

        console.error(error);

        showModal(
            "Upload ব্যর্থ",
            error.message ||
            "Shop information সংরক্ষণ করা যায়নি।"
        );

    }finally{

        setLoading(false);

    }

});


function setLoading(
    state,
    text="প্রস্তুত করা হচ্ছে..."
){

    const loading=
        document.getElementById(
            "loading"
        );

    document.getElementById(
        "loadingText"
    ).textContent=text;


    if(state)
        loading.classList.add("show");
    else
        loading.classList.remove("show");

}


window.showModal=(title,text)=>{

    document.getElementById(
        "modalTitle"
    ).textContent=title;

    document.getElementById(
        "modalText"
    ).textContent=text;

    document.getElementById(
        "modal"
    ).classList.add("show");

};


window.closeModal=()=>{

    document.getElementById(
        "modal"
    ).classList.remove("show");

};

</script>

</body>
</html>
