<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Personal Information — GHOTI MARKET</title>

<link rel="icon" href="https://seller.ghotimarket.com/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:"Hind Siliguri",sans-serif;
    background:
        radial-gradient(circle at top left,#ffeadc,transparent 32%),
        linear-gradient(135deg,#fff,#fff8f4);
    color:#171717;
}

.wrapper{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:35px 18px 50px;
}

.top{
    text-align:center;
    margin-bottom:28px;
}

.logo{
    width:65px;
    height:65px;
    padding:9px;
    background:#fff2e9;
    border-radius:18px;
    margin:0 auto 17px;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.progress{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:25px;
}

.step{
    width:35px;
    height:35px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:13px;
    background:#ffe7d8;
    color:#ff6a00;
}

.step.active{
    background:#ff6a00;
    color:white;
}

.line{
    width:45px;
    height:3px;
    background:#ffe0cc;
    border-radius:10px;
}

h1{
    font-size:29px;
}

.subtitle{
    margin-top:7px;
    color:#777;
    font-size:14px;
}

.card{
    background:#fff;
    border:1px solid #ffe2d0;
    border-radius:25px;
    padding:27px;
    box-shadow:0 20px 55px rgba(0,0,0,.07);
}

.field{
    margin-bottom:20px;
}

label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:8px;
}

.input-wrap{
    position:relative;
}

.input-icon{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:#999;
}

.input-icon svg{
    width:19px;
    height:19px;
}

input{
    width:100%;
    height:53px;
    border:1px solid #e8e8e8;
    border-radius:14px;
    padding:0 15px 0 46px;
    outline:none;
    font-family:inherit;
    font-size:15px;
    background:#fafafa;
    transition:.2s;
}

input:focus{
    background:#fff;
    border-color:#ff6a00;
    box-shadow:0 0 0 4px rgba(255,106,0,.1);
}

.next{
    width:100%;
    height:54px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#ff7a18,#ff6a00);
    color:#fff;
    font-family:inherit;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 12px 25px rgba(255,106,0,.2);
}

.next:disabled{
    opacity:.6;
}

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    backdrop-filter:blur(7px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    opacity:0;
    visibility:hidden;
    transition:.2s;
    z-index:20;
}

.modal-bg.show{
    opacity:1;
    visibility:visible;
}

.modal{
    width:100%;
    max-width:380px;
    background:#fff;
    border-radius:23px;
    padding:27px;
    text-align:center;
    box-shadow:0 25px 70px rgba(0,0,0,.2);
}

.modal-icon{
    width:56px;
    height:56px;
    margin:auto;
    border-radius:17px;
    background:#fff1e8;
    color:#ff6a00;
    display:flex;
    align-items:center;
    justify-content:center;
}

.modal-icon svg{
    width:27px;
    height:27px;
}

.modal h2{
    margin-top:15px;
    font-size:21px;
}

.modal p{
    margin-top:7px;
    color:#777;
    font-size:14px;
    line-height:1.7;
}

.modal button{
    width:100%;
    height:47px;
    margin-top:20px;
    border:0;
    border-radius:12px;
    background:#ff6a00;
    color:#fff;
    font-family:inherit;
    font-weight:700;
}

.loading{
    position:fixed;
    inset:0;
    background:rgba(255,255,255,.8);
    backdrop-filter:blur(7px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:30;
}

.loading.show{
    display:flex;
}

.loading-box{
    background:#fff;
    padding:28px 35px;
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.12);
    text-align:center;
}

.spinner{
    width:36px;
    height:36px;
    border:4px solid #ffe0cc;
    border-top-color:#ff6a00;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:auto;
}

.loading p{
    margin-top:13px;
    font-size:14px;
    font-weight:600;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

@media(max-width:480px){
    .wrapper{
        padding:25px 15px 35px;
    }

    .card{
        padding:21px;
        border-radius:20px;
    }

    h1{
        font-size:25px;
    }
}

</style>
</head>

<body>

<div class="wrapper">

    <div class="top">

        <div class="logo">
            <img src="https://seller.ghotimarket.com/logo.png">
        </div>

        <div class="progress">
            <div class="step active">1</div>
            <div class="line"></div>
            <div class="step">2</div>
            <div class="line"></div>
            <div class="step">3</div>
        </div>

        <h1>ব্যক্তিগত তথ্য</h1>

        <div class="subtitle">
            আপনার অ্যাকাউন্ট তৈরির প্রথম ধাপ সম্পন্ন করুন
        </div>

    </div>


    <div class="card">

        <form id="form">

            <div class="field">

                <label>Full Name</label>

                <div class="input-wrap">

                    <span class="input-icon">
                        <svg viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M4 21c.8-4 3.5-6 8-6s7.2 2 8 6"/>
                        </svg>
                    </span>

                    <input
                        id="fullName"
                        type="text"
                        placeholder="আপনার পূর্ণ নাম"
                        autocomplete="name"
                        required
                    >

                </div>

            </div>


            <div class="field">

                <label>WhatsApp Number</label>

                <div class="input-wrap">

                    <span class="input-icon">
                        <svg viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2">
                            <path d="M21 11.5a8.4 8.4 0 0 1-9 8.3 8.7 8.7 0 0 1-4-.9L3 20l1.2-4.7A8.2 8.2 0 1 1 21 11.5z"/>
                            <path d="M8.5 8.5c.3 2 2 4 4 5 .6.3 1.2.1 1.6-.4l.5-.7"/>
                        </svg>
                    </span>

                    <input
                        id="whatsapp"
                        type="tel"
                        placeholder="01XXXXXXXXX"
                        inputmode="numeric"
                        maxlength="11"
                        required
                    >

                </div>

            </div>


            <button
                class="next"
                type="submit"
                id="nextBtn"
            >
                পরের ধাপ
            </button>

        </form>

    </div>

</div>


<!-- MODAL -->

<div class="modal-bg" id="modal">

    <div class="modal">

        <div class="modal-icon">
            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 8v4"/>
                <path d="M12 16h.01"/>
            </svg>
        </div>

        <h2 id="modalTitle">তথ্য সঠিক নয়</h2>

        <p id="modalText">
            অনুগ্রহ করে তথ্যগুলো যাচাই করুন।
        </p>

        <button onclick="closeModal()">
            ঠিক আছে
        </button>

    </div>

</div>


<div class="loading" id="loading">

    <div class="loading-box">

        <div class="spinner"></div>

        <p>পরবর্তী ধাপ প্রস্তুত করা হচ্ছে...</p>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


const firebaseConfig = {
    apiKey:"AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE",
    authDomain:"ghotimarket.firebaseapp.com",
    projectId:"ghotimarket"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


let currentUser=null;


onAuthStateChanged(auth,async(user)=>{

    if(!user){
        location.replace("/signup");
        return;
    }

    currentUser=user;

    try{

        const snap=await getDoc(
            doc(db,"users",user.uid)
        );

        if(snap.exists()){

            location.replace("/dashboard");
            return;

        }

    }catch(error){

        console.error(error);

    }

});


const form=document.getElementById("form");
const fullName=document.getElementById("fullName");
const whatsapp=document.getElementById("whatsapp");
const loading=document.getElementById("loading");


form.addEventListener("submit",(e)=>{

    e.preventDefault();

    const name=fullName.value.trim();
    const phone=whatsapp.value.trim();


    if(name.length<2){

        showModal(
            "নাম প্রয়োজন",
            "অনুগ্রহ করে আপনার পূর্ণ নাম লিখুন।"
        );

        return;

    }


    if(!/^01[3-9]\d{8}$/.test(phone)){

        showModal(
            "WhatsApp Number সঠিক নয়",
            "১১ সংখ্যার একটি বৈধ বাংলাদেশি নম্বর লিখুন।"
        );

        return;

    }


    localStorage.setItem(
        "fullName",
        name
    );

    localStorage.setItem(
        "whatsapp",
        phone
    );


    loading.classList.add("show");

    setTimeout(()=>{
        location.href="/signup2";
    },300);

});


window.showModal=(title,text)=>{

    document.getElementById("modalTitle")
        .textContent=title;

    document.getElementById("modalText")
        .textContent=text;

    document.getElementById("modal")
        .classList.add("show");

};


window.closeModal=()=>{

    document.getElementById("modal")
        .classList.remove("show");

};

</script>

</body>
</html>
