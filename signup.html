<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Signup - ধাপ ১ | GHOTI MARKET</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="signup.css">
</head>
<body>
<header><img src="https://ghotimarket.com/logo.png" alt="GHOTI MARKET"></header>
<div class="container">
  <div class="progress"><div class="step active">১</div><div class="step">২</div></div>
  <h2>ব্যক্তিগত তথ্য</h2>
  <form id="signupForm">
    <div class="input-group"><i class="fas fa-user"></i><input type="text" id="fullName" placeholder="পুরো নাম" required></div>
    <div class="input-group"><i class="fas fa-envelope"></i><input type="email" id="email" placeholder="ইমেইল" required></div>
    <div class="input-group"><i class="fas fa-phone"></i><input type="tel" id="whatsapp" placeholder="Whatsapp 01XXXXXXXXX" required></div>
    <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="password" placeholder="পাসওয়ার্ড ৬+ অক্ষর" required></div>
    <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="confirmPassword" placeholder="পাসওয়ার্ড নিশ্চিত করুন" required></div>
    
  <label>NID সামনের ছবি</label>
<div class="upload-box" onclick="document.getElementById('nidFront').click()">
  <i class="fas fa-cloud-upload-alt"></i>
  <p>Nid কার্ডের সামনের  ছবি সিলেক্ট করুন।</p>
  <input type="file" id="nidFront" accept="image/*" required>
  <img id="nidFrontPreview" class="image-preview"> <!-- class=image-preview -->
</div>

<label>NID পিছনের ছবি</label>
<div class="upload-box" onclick="document.getElementById('nidBack').click()">
  <i class="fas fa-cloud-upload-alt"></i>
  <p>NID কার্ডের পেছনের ছবি সিলেক্ট করুন।</p>
  <input type="file" id="nidBack" accept="image/*" required>
  <img id="nidBackPreview" class="image-preview"> <!-- class=image-preview -->
</div>
    <button type="submit" id="nextBtn">পরবর্তী <i class="fas fa-arrow-right"></i></button>
  </form>
</div>
<div id="customPopup"></div>
<script type="module" src="signup.js"></script>
</body>
</html>
