<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Seller Dashboard | GHOTI MARKET</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --primary:#FF6A00;
  --primary-dark:#E55A00;
  --bg:#FFF8F3;
  --card:#FFFFFF;
  --text:#1e293b;
  --text-sub:#64748b;
  --border:#FFE3D1;
  --shadow:0 8px 30px rgba(255,106,0,0.08);
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Hind Siliguri','Inter',sans-serif;}
body{background:var(--bg);color:var(--text);line-height:1.5;}

header{
  background:var(--card);display:flex;justify-content:space-between;align-items:center;
  padding:14px 24px;box-shadow:var(--shadow);position:sticky;top:0;z-index:100;
}
.header-left{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:800;color:var(--primary);}
.header-left img{width:40px;height:40px;object-fit:contain;}
.header-right{display:flex;align-items:center;gap:15px;}
.seller-info{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--text);}
#newOrderBadge{display:none;background:#EF4444;color:#fff;padding:5px 12px;border-radius:50px;font-size:12px;font-weight:700;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.btn-logout{background:var(--primary);color:#fff;border:none;padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:700;transition:0.2s;}
.btn-logout:hover{background:var(--primary-dark);}

.container{max-width:1300px;margin:0 auto;padding:25px 15px;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:25px;}
.stat-card{background:var(--card);padding:20px;border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;}
.stat-card-header{display:flex;justify-content:space-between;align-items:center;color:var(--text-sub);font-size:13px;font-weight:600;}
.stat-card-header i{font-size:18px;color:var(--primary);}
.stat-card h2{font-size:26px;color:var(--primary);margin-top:10px;font-weight:800;}

.toolbar{display:flex;gap:12px;margin-bottom:25px;flex-wrap:wrap;}
.search-box{flex:1;min-width:250px;position:relative;}
.search-box i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-sub);}
.search-box input{width:100%;padding:14px 14px 14px 46px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;background:#fff;}
.toolbar select{padding:14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;background:#fff;min-width:160px;cursor:pointer;}
.search-box input:focus,.toolbar select:focus{outline:none;border-color:var(--primary);}

.order-card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:var(--shadow);transition:0.3s;border:1px solid var(--border);}
.order-card:hover{transform:translateY(-3px);}
.order-card.new{animation:newOrderAnim 0.6s ease 2;}
@keyframes newOrderAnim{0%{box-shadow:0 0 0 0 rgba(255,106,0,0.4)}100%{box-shadow:0 0 0 20px rgba(255,106,0,0)}}

.order-header-info{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:15px;flex-wrap:wrap;gap:10px;}
.track-id{font-weight:800;color:var(--primary);font-size:15px;}
.order-date{font-size:13px;color:var(--text-sub);}

.order-item-row{display:flex;gap:15px;align-items:flex-start;background:#FFF8F3;padding:12px;border-radius:12px;border:1px solid var(--border);margin-bottom:10px;}
.order-item-row img{width:70px;height:70px;border-radius:10px;object-fit:cover;flex-shrink:0;}
.order-item-details{flex:1;}
.order-item-details h4{font-size:14px;font-weight:700;margin-bottom:4px;}
.item-meta{font-size:12px;color:var(--text-sub);margin-bottom:2px;}
.variant-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.variant-chip{background:#FFE3D1;color:var(--primary-dark);padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;}

.customer-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;background:#fafaf9;padding:12px 15px;border-radius:12px;font-size:13px;margin-bottom:15px;}
.customer-summary div{color:var(--text);}
.customer-summary b{color:var(--text-sub);}

.order-footer-bar{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:15px;flex-wrap:wrap;gap:12px;}
.order-total-price{font-size:16px;font-weight:800;color:var(--primary);}
.order-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.btn{padding:10px 16px;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-outline{border:1.5px solid var(--primary);background:#fff;color:var(--primary);}
.btn-outline:hover{background:var(--bg);}
.status-select{padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;background:#fff;cursor:pointer;font-weight:600;}

.status-badge{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block;}
.status-Pending{background:#FEF3C7;color:#92400E;}
.status-Confirmed{background:#E0E7FF;color:#3730A3;}
.status-Packaging{background:#FED7AA;color:#9A3412;}
.status-Processing{background:#DBEAFE;color:#1E40AF;}
.status-Shipped{background:#FEE2E2;color:#991B1B;}
.status-Delivered{background:#D1FAE5;color:#065F46;}
.status-Cancelled{background:#F3F4F6;color:#374151;}
.status-Returned{background:#FEE2E2;color:#7F1D1D;}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9999;justify-content:center;align-items:center;padding:20px;}
.modal.show{display:flex;animation:fade .3s;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-content{background:#fff;border-radius:20px;width:100%;max-width:700px;max-height:90vh;overflow-y:auto;padding:30px;position:relative;}
.close-btn{position:absolute;right:20px;top:20px;font-size:26px;cursor:pointer;color:var(--text-sub);transition:0.2s;}
.close-btn:hover{color:var(--text);}
.modal-section{background:#FFF8F3;border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:15px;}
.modal-section h3{font-size:15px;color:var(--primary);margin-bottom:10px;display:flex;align-items:center;gap:8px;}

.confirm-box{background:#fff;border-radius:20px;padding:30px;text-align:center;max-width:400px;width:100%;box-shadow:var(--shadow);}
.confirm-box i{font-size:48px;color:var(--primary);margin-bottom:15px;}
.confirm-btns{display:flex;gap:12px;margin-top:20px;}
.btn-cancel{flex:1;padding:12px;border:none;border-radius:10px;background:#f1f5f9;font-weight:700;cursor:pointer;color:var(--text);}
.btn-confirm{flex:1;padding:12px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer;}

#toast{position:fixed;bottom:25px;right:25px;background:#22c55e;color:#fff;padding:14px 22px;border-radius:12px;display:none;z-index:10000;font-weight:600;box-shadow:0 4px 12px rgba(34,197,94,0.3);}
#emptyState{display:none;text-align:center;padding:60px 20px;color:var(--text-sub);}
#emptyState i{font-size:64px;margin-bottom:15px;color:#cbd5e1;}

.skeleton{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;animation:load 1.5s infinite;border-radius:var(--radius);}
@keyframes load{0%{background-position:200% 0}100%{background-position:-200% 0}}
.stat-card.skeleton{height:95px;}
.order-card.skeleton{height:220px;}

@media(max-width:768px){
  .header-right .seller-info span{display:none;}
  .btn-logout span{display:none;}
  .order-footer-bar{flex-direction:column;align-items:flex-start;}
  .order-actions{width:100%;justify-content:space-between;}
  .status-select{flex:1;}
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <img src="https://i.ibb.co.com/RG2hrf3y/background-remove-ghoti-market.png" alt="Logo">
    <span>GHOTI SELLER</span>
  </div>
  <div class="header-right">
    <div id="newOrderBadge">New Order!</div>
    <div class="seller-info">
      <i class="fas fa-user-circle"></i>
      <span id="sellerName">Loading...</span>
    </div>
    <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></button>
  </div>
</header>

<main class="container">
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card skeleton"></div>
    <div class="stat-card skeleton"></div>
    <div class="stat-card skeleton"></div>
    <div class="stat-card skeleton"></div>
    <div class="stat-card skeleton"></div>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search by Track ID, Name, Phone, Product...">
    </div>
    <select id="statusFilter">
      <option value="">সকল স্ট্যাটাস</option>
      <option value="Pending">পেন্ডিং</option>
      <option value="Confirmed">কনফার্মড</option>
      <option value="Packaging">প্যাকেজিং</option>
      <option value="Processing">প্রসেসিং</option>
      <option value="Shipped">শিপড</option>
      <option value="Delivered">ডেলিভারড</option>
      <option value="Cancelled">বাতিল</option>
      <option value="Returned">রিটার্ন</option>
    </select>
    <select id="sortFilter">
      <option value="desc">Newest First</option>
      <option value="asc">Oldest First</option>
    </select>
  </div>

  <div id="loadingSkeleton">
    <div class="order-card skeleton"></div>
    <div class="order-card skeleton"></div>
    <div class="order-card skeleton"></div>
  </div>

  <div id="ordersList"></div>

  <div id="emptyState">
    <i class="fas fa-box-open"></i>
    <h3>কোনো অর্ডার পাওয়া যায়নি</h3>
    <p>নতুন অর্ডার এলে এখানে দেখা যাবে</p>
  </div>
</main>

<div id="detailsModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <h2 style="margin-bottom:20px;color:var(--text);display:flex;align-items:center;gap:10px;"><i class="fas fa-file-invoice" style="color:var(--primary);"></i> অর্ডারের বিস্তারিত বিবরণ</h2>
    <div id="modalBody"></div>
  </div>
</div>

<div id="confirmModal" class="modal">
  <div class="confirm-box">
    <i class="fas fa-question-circle"></i>
    <h3>স্ট্যাটাস আপডেট নিশ্চিত করুন</h3>
    <p id="confirmText" style="color:var(--text-sub);margin-top:10px;"></p>
    <div class="confirm-btns">
      <button class="btn-cancel" onclick="closeConfirm()">বাতিল</button>
      <button class="btn-confirm" id="confirmUpdateBtn">কনফার্ম</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<audio id="notifSound" src="https://cdn.freesound.org/previews/270/270404_5123851-lq.mp3" preload="auto"></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  query,
  where,
  onSnapshot,
  doc,
  getDoc,
  updateDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE",
  authDomain: "ghotimarket.firebaseapp.com",
  projectId: "ghotimarket",
  storageBucket: "ghotimarket.firebasestorage.app",
  messagingSenderId: "481257644093",
  appId: "1:481257644093:web:0dfc3699d6b3c86afeca54"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let allOrders = [];
let confirmCallback = null;
let isFirstLoad = true;

const statusBengali = {
  'Pending': 'পেন্ডিং',
  'Confirmed': 'কনফার্মড',
  'Packaging': 'প্যাকেজিং',
  'Processing': 'প্রসেসিং',
  'Shipped': 'শিপড',
  'Delivered': 'ডেলিভারড',
  'Cancelled': 'বাতিল',
  'Returned': 'রিটার্ন'
};

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "index.html";
    return;
  }

  try {
    const userRef = doc(db, "users", user.uid);
    const userSnap = await getDoc(userRef);

    if (!userSnap.exists()) {
      window.location.href = "index.html";
      return;
    }

    const userData = userSnap.data();

    if (!userData.profileUnlockedUntil || userData.profileUnlockedUntil < Date.now()) {
      window.location.href = "locked.html";
      return;
    }

    currentUser = user;
    document.getElementById("sellerName").innerText = userData.shopName || user.displayName || user.email;

    loadOrders();
  } catch (err) {
    console.error("Auth check error:", err);
    showToast("প্রমাণীকরণ ত্রুটি ঘটেছে", "error");
  }
});

document.getElementById('logoutBtn').onclick = async () => {
  await signOut(auth);
  window.location.href = "index.html";
};

function loadOrders() {
  const q = query(collection(db, "orders"), where("sellerId", "==", currentUser.uid));
  
  onSnapshot(q, (snapshot) => {
    const changes = snapshot.docChanges();
    
    if (!isFirstLoad) {
      const newOrders = changes.filter(c => c.type === 'added');
      if (newOrders.length > 0) {
        document.getElementById('notifSound').play().catch(()=>{});
        const badge = document.getElementById('newOrderBadge');
        badge.style.display = 'block';
        setTimeout(() => badge.style.display = 'none', 5000);
      }
    }
    isFirstLoad = false;

    allOrders = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    
    document.getElementById('loadingSkeleton').style.display = 'none';
    renderStats();
    renderOrders();
  }, (error) => {
    console.error("Error loading orders:", error);
    showToast("অর্ডার লোড করতে সমস্যা হয়েছে", "error");
  });
}

function renderStats() {
  const stats = {
    total: allOrders.length,
    new: allOrders.filter(o => o.orderStatus === 'Pending').length,
    processing: allOrders.filter(o => ['Confirmed','Packaging','Processing','Shipped'].includes(o.orderStatus)).length,
    delivered: allOrders.filter(o => o.orderStatus === 'Delivered').length,
    cancelled: allOrders.filter(o => ['Cancelled', 'Returned'].includes(o.orderStatus)).length
  };

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card">
      <div class="stat-card-header"><span>মোট অর্ডার</span><i class="fas fa-shopping-bag"></i></div>
      <h2>${stats.total}</h2>
    </div>
    <div class="stat-card">
      <div class="stat-card-header"><span>নতুন অর্ডার</span><i class="fas fa-bell"></i></div>
      <h2>${stats.new}</h2>
    </div>
    <div class="stat-card">
      <div class="stat-card-header"><span>প্রসেসিং</span><i class="fas fa-spinner"></i></div>
      <h2>${stats.processing}</h2>
    </div>
    <div class="stat-card">
      <div class="stat-card-header"><span>ডেলিভারি হয়েছে</span><i class="fas fa-check-circle"></i></div>
      <h2>${stats.delivered}</h2>
    </div>
    <div class="stat-card">
      <div class="stat-card-header"><span>বাতিল/রিটার্ন</span><i class="fas fa-ban"></i></div>
      <h2>${stats.cancelled}</h2>
    </div>
  `;
}

function escapeHTML(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function formatDate(timestamp) {
  if (!timestamp) return 'তারিখ পাওয়া যায়নি';
  try {
    if (typeof timestamp.toDate === 'function') {
      return timestamp.toDate().toLocaleString('bn-BD', {
        year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    }
    return new Date(timestamp).toLocaleString('bn-BD');
  } catch (e) {
    return 'তারিখ পাওয়া যায়নি';
  }
}

function renderVariants(selectedVariants) {
  if (!selectedVariants || typeof selectedVariants !== 'object' || Object.keys(selectedVariants).length === 0) {
    return '';
  }
  let chips = '';
  for (const [key, val] of Object.entries(selectedVariants)) {
    chips += `<span class="variant-chip">${escapeHTML(key)}: ${escapeHTML(val)}</span>`;
  }
  return `<div class="variant-chips">${chips}</div>`;
}

function calculateItemDisplay(item) {
  const basePrice = item.basePrice !== undefined ? Number(item.basePrice) : (item.price !== undefined ? Number(item.price) : 0);
  const extraPrice = item.extraPrice !== undefined ? Number(item.extraPrice) : 0;
  const unitPrice = basePrice + extraPrice;
  const quantity = item.quantity !== undefined ? Number(item.quantity) : 1;
  const itemTotal = unitPrice * quantity;
  return { basePrice, extraPrice, unitPrice, quantity, itemTotal };
}

function getOrderItems(order) {
  if (Array.isArray(order.items) && order.items.length > 0) {
    return order.items;
  }
  return [{
    name: order.productName || 'নামহীন পণ্য',
    image: order.productImage || '',
    price: order.productPrice || 0,
    basePrice: order.productPrice || 0,
    extraPrice: 0,
    quantity: order.quantity || 1,
    selectedVariants: order.selectedVariants || {}
  }];
}

function renderOrders() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const status = document.getElementById('statusFilter').value;
  const sort = document.getElementById('sortFilter').value;

  let filtered = allOrders.filter(o => {
    const trackId = (o.orderTrackId || '').toLowerCase();
    const customerName = (o.customerName || '').toLowerCase();
    const customerPhone = (o.customerPhone || '');
    const shopName = (o.shopName || '').toLowerCase();
    const email = (o.email || '').toLowerCase();
    
    let matchProduct = false;
    const items = getOrderItems(o);
    for (const item of items) {
      if ((item.name || '').toLowerCase().includes(search) || (item.slug || '').toLowerCase().includes(search)) {
        matchProduct = true;
        break;
      }
    }

    const matchSearch = 
      trackId.includes(search) ||
      customerName.includes(search) ||
      customerPhone.includes(search) ||
      shopName.includes(search) ||
      email.includes(search) ||
      matchProduct;

    const matchStatus = status ? o.orderStatus === status : true;
    return matchSearch && matchStatus;
  });

  filtered.sort((a, b) => {
    const timeA = a.createdAt?.seconds || (a.createdAt ? new Date(a.createdAt).getTime() / 1000 : 0);
    const timeB = b.createdAt?.seconds || (b.createdAt ? new Date(b.createdAt).getTime() / 1000 : 0);
    return sort === 'desc' ? timeB - timeA : timeA - timeB;
  });

  const ordersListEl = document.getElementById('ordersList');
  const emptyStateEl = document.getElementById('emptyState');

  if (filtered.length === 0) {
    emptyStateEl.style.display = 'block';
    ordersListEl.innerHTML = '';
    return;
  }
  emptyStateEl.style.display = 'none';

  ordersListEl.innerHTML = filtered.map(o => {
    const dateStr = formatDate(o.createdAt);
    const displayStatus = statusBengali[o.orderStatus] || o.orderStatus || 'Pending';
    const items = getOrderItems(o);
    
    let itemsHtml = '';
    if (items.length === 1) {
      const item = items[0];
      const calc = calculateItemDisplay(item);
      const variantsHtml = renderVariants(item.selectedVariants || o.selectedVariants);
      itemsHtml = `
        <div class="order-item-row">
          <img src="${escapeHTML(item.image || o.productImage || '')}" alt="${escapeHTML(item.name || o.productName || '')}" onerror="this.src='https://via.placeholder.com/70?text=No+Image'">
          <div class="order-item-details">
            <h4>${escapeHTML(item.name || o.productName || 'পণ্য')}</h4>
            <div class="item-meta">পরিমাণ: ${calc.quantity} পিস</div>
            <div class="item-meta">মূল্য: ৳${calc.unitPrice} × ${calc.quantity} = <b>৳${calc.itemTotal}</b></div>
            ${variantsHtml}
          </div>
        </div>
      `;
    } else {
      itemsHtml = `
        <div style="background:#FFF8F3;padding:12px;border-radius:12px;border:1.5px dashed var(--border);margin-bottom:12px;">
          <div style="font-weight:700;color:var(--primary);margin-bottom:8px;font-size:14px;"><i class="fas fa-boxes"></i> মোট পণ্য সংখ্যা: ${items.length}টি</div>
          <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;">
            ${items.map(item => `
              <div style="display:flex;align-items:center;gap:8px;background:#fff;padding:6px 10px;border-radius:8px;border:1px solid var(--border);flex-shrink:0;">
                <img src="${escapeHTML(item.image || '')}" style="width:40px;height:40px;border-radius:6px;object-fit:cover;" onerror="this.src='https://via.placeholder.com/40'">
                <div>
                  <div style="font-size:12px;font-weight:700;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHTML(item.name || '')}</div>
                  <div style="font-size:11px;color:var(--text-sub);">Qty: ${item.quantity || 1}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    let affiliateHtml = '';
    if (o.affiliateApplied === true) {
      affiliateHtml = `
        <div style="background:#FFF4EC; border:1px solid var(--border); padding:12px; border-radius:12px; margin-bottom:12px; font-size:13px;">
          <b style="color:var(--primary);"><i class="fas fa-tag"></i> এফিলিয়েট অর্ডার তথ্য</b><br>
          <b>প্রোমো কোড:</b> ${escapeHTML(o.affiliatePromoCode || 'N/A')} | 
          <b>ডিসকাউন্ট:</b> ৳${escapeHTML(o.affiliateDiscount || 0)}
        </div>
      `;
    }

    return `
    <div class="order-card">
      <div class="order-header-info">
        <div class="track-id">অর্ডার আইডি: #${escapeHTML(o.orderTrackId || o.id.substring(0,8))}</div>
        <div class="order-date"><i class="far fa-clock"></i> ${dateStr}</div>
        <div><span class="status-badge status-${escapeHTML(o.orderStatus || 'Pending')}">${escapeHTML(displayStatus)}</span></div>
      </div>

      <div class="customer-summary">
        <div><b>গ্রাহক:</b> ${escapeHTML(o.customerName || 'নাম নেই')}</div>
        <div><b>ফোন:</b> ${escapeHTML(o.customerPhone || 'N/A')}</div>
        <div><b>ঠিকানা:</b> ${escapeHTML(o.division || '')}, ${escapeHTML(o.district || '')}, ${escapeHTML(o.upazila || '')}</div>
      </div>

      ${itemsHtml}
      ${affiliateHtml}

      <div class="order-footer-bar">
        <div class="order-total-price">সর্বমোট: ৳${escapeHTML(o.grandTotal || 0)}</div>
        <div class="order-actions">
          <button class="btn btn-outline" onclick="viewDetails('${escapeHTML(o.id)}')"><i class="fas fa-eye"></i> বিস্তারিত দেখুন</button>
          <select class="status-select" onchange="requestStatusUpdate('${escapeHTML(o.id)}', this.value)">
            <option value="">স্ট্যাটাস আপডেট</option>
            <option value="Confirmed">কনফার্মড</option>
            <option value="Packaging">প্যাকেজিং</option>
            <option value="Processing">প্রসেসিং</option>
            <option value="Shipped">শিপড</option>
            <option value="Delivered">ডেলিভারড</option>
            <option value="Cancelled">বাতিল</option>
            <option value="Returned">রিটার্ন</option>
          </select>
        </div>
      </div>
    </div>
  `;
  }).join('');
}

window.viewDetails = (id) => {
  const o = allOrders.find(x => x.id === id);
  if (!o) return;

  const dateStr = formatDate(o.createdAt);
  const displayStatus = statusBengali[o.orderStatus] || o.orderStatus || 'Pending';
  const deliveryStatus = statusBengali[o.deliveryStatus] || o.deliveryStatus || 'Pending';
  const items = getOrderItems(o);

  let productsModalHtml = items.map(item => {
    const calc = calculateItemDisplay(item);
    const variantsHtml = renderVariants(item.selectedVariants || o.selectedVariants);
    const extraPriceLine = calc.extraPrice > 0 ? `<p>ভ্যারিয়েন্ট অতিরিক্ত মূল্য: +৳${calc.extraPrice}</p>` : '';
    const basePriceDisplay = item.basePrice !== undefined ? item.basePrice : item.price;

    return `
      <div style="display:flex;gap:15px;align-items:flex-start;background:#fff;padding:12px;border-radius:12px;border:1px solid var(--border);margin-bottom:10px;">
        <img src="${escapeHTML(item.image || o.productImage || '')}" style="width:75px;height:75px;border-radius:10px;object-fit:cover;" onerror="this.src='https://via.placeholder.com/75'">
        <div style="flex:1;font-size:13px;">
          <h4 style="font-size:14px;font-weight:700;margin-bottom:4px;">${escapeHTML(item.name || o.productName || '')}</h4>
          <p>মূল মূল্য: ৳${basePriceDisplay}</p>
          ${extraPriceLine}
          <p>প্রতি পিস: ৳${calc.unitPrice} | পরিমাণ: ${calc.quantity}</p>
          <p style="font-weight:700;color:var(--primary);margin-top:2px;">পণ্যের মোট: ৳${calc.itemTotal}</p>
          ${variantsHtml}
        </div>
      </div>
    `;
  }).join('');

  let affiliateSectionHtml = '';
  if (o.affiliateApplied === true) {
    const originalSub = o.originalSubtotal !== undefined ? o.originalSubtotal : (o.subtotal || 0);
    const discountedSub = o.discountedSubtotal !== undefined ? o.discountedSubtotal : (originalSub - (o.affiliateDiscount || 0));
    
    affiliateSectionHtml = `
      <div class="modal-section">
        <h3><i class="fas fa-tag"></i> এফিলিয়েট তথ্য</h3>
        <p><b>প্রোমো কোড:</b> ${escapeHTML(o.affiliatePromoCode || 'N/A')}</p>
        <p><b>এফিলিয়েট ইউজার আইডি:</b> ${escapeHTML(o.affiliateUserId || 'N/A')}</p>
        <p><b>এফিলিয়েট ডিসকাউন্ট:</b> -৳${escapeHTML(o.affiliateDiscount || 0)}</p>
        <p><b>মূল সাবটোটাল:</b> ৳${escapeHTML(originalSub)}</p>
        <p><b>ডিসকাউন্টের পর সাবটোটাল:</b> ৳${escapeHTML(discountedSub)}</p>
        <p><b>ডেলিভারি চার্জ:</b> ৳${escapeHTML(o.deliveryCharge || 0)}</p>
        <p style="margin-top:4px;"><b>গ্রাহকের চূড়ান্ত পেমেন্ট:</b> <b>৳${escapeHTML(o.grandTotal || 0)}</b></p>
      </div>
    `;
  }

  document.getElementById('modalBody').innerHTML = `
    <div class="modal-section">
      <h3><i class="fas fa-info-circle"></i> অর্ডার সারাংশ</h3>
      <p><b>অর্ডার ট্র্যাক আইডি:</b> #${escapeHTML(o.orderTrackId || o.id)}</p>
      <p><b>অর্ডারের তারিখ:</b> ${dateStr}</p>
      <p><b>অর্ডার স্ট্যাটাস:</b> ${escapeHTML(displayStatus)}</p>
      <p><b>ডেলিভারি স্ট্যাটাস:</b> ${escapeHTML(deliveryStatus)}</p>
      <p><b>নোট:</b> ${escapeHTML(o.orderNote || 'কোনো নোট নেই')}</p>
    </div>

    <div class="modal-section">
      <h3><i class="fas fa-user"></i> গ্রাহকের তথ্য</h3>
      <p><b>নাম:</b> ${escapeHTML(o.customerName || 'N/A')}</p>
      <p><b>ফোন:</b> ${escapeHTML(o.customerPhone || 'N/A')}</p>
      <p><b>ইমেইল:</b> ${escapeHTML(o.email || 'N/A')}</p>
    </div>

    <div class="modal-section">
      <h3><i class="fas fa-map-marker-alt"></i> শিপিং ঠিকানা</h3>
      <p><b>বিভাগ:</b> ${escapeHTML(o.division || 'N/A')}</p>
      <p><b>জেলা:</b> ${escapeHTML(o.district || 'N/A')}</p>
      <p><b>উপজেলা:</b> ${escapeHTML(o.upazila || 'N/A')}</p>
      <p><b>সম্পূর্ণ ঠিকানা:</b> ${escapeHTML(o.fullAddress || o.address || 'N/A')}</p>
    </div>

    <div class="modal-section">
      <h3><i class="fas fa-box"></i> পণ্যের বিবরণ</h3>
      ${productsModalHtml}
    </div>

    ${affiliateSectionHtml}

    <div class="modal-section">
      <h3><i class="fas fa-credit-card"></i> পেমেন্ট তথ্য</h3>
      <p><b>পেমেন্ট পদ্ধতি:</b> ${escapeHTML(o.paymentMethod || 'Cash On Delivery')}</p>
      <p><b>পেমেন্ট স্ট্যাটাস:</b> ${escapeHTML(o.paymentStatus || 'Pending')}</p>
    </div>

    <div class="modal-section" style="background:#FFF4EC;">
      <h3><i class="fas fa-calculator"></i> আর্থিক হিসাব</h3>
      <p>অরিজিনাল সাবটোটাল: ৳${escapeHTML(o.originalSubtotal !== undefined ? o.originalSubtotal : (o.subtotal || 0))}</p>
      ${o.affiliateApplied ? `<p>এফিলিয়েট ডিসকাউন্ট: -৳${escapeHTML(o.affiliateDiscount || 0)}</p>` : ''}
      <p>ডিসকাউন্টেড সাবটোটাল: ৳${escapeHTML(o.discountedSubtotal !== undefined ? o.discountedSubtotal : (o.subtotal || 0))}</p>
      <p>ডেলিভারি চার্জ: +৳${escapeHTML(o.deliveryCharge || 0)}</p>
      <p style="font-size:16px;font-weight:800;color:var(--primary);margin-top:6px;">সর্বমোট পেমেন্ট: ৳${escapeHTML(o.grandTotal || 0)}</p>
    </div>
  `;

  document.getElementById('detailsModal').classList.add('show');
}

window.closeModal = () => {
  document.getElementById('detailsModal').classList.remove('show');
};

window.requestStatusUpdate = (id, status) => {
  if (!status) return;

  const displayStatusTarget = statusBengali[status] || status;
  document.getElementById('confirmText').innerText = `আপনি কি নিশ্চিত যে এই অর্ডারের স্ট্যাটাস "${displayStatusTarget}" এ পরিবর্তন করতে চান?`;
  document.getElementById('confirmModal').classList.add('show');

  confirmCallback = async () => {
    try {
      await updateDoc(doc(db, "orders", id), {
        orderStatus: status,
        deliveryStatus: status,
        updatedAt: serverTimestamp()
      });
      showToast("অর্ডারের স্ট্যাটাস সফলভাবে আপডেট করা হয়েছে!");
    } catch (e) {
      console.error("Status update error:", e);
      showToast("স্ট্যাটাস আপডেট করতে ব্যর্থ হয়েছে", "error");
    }
  };
};

window.closeConfirm = () => {
  document.getElementById('confirmModal').classList.remove('show');
};

document.getElementById('confirmUpdateBtn').onclick = () => {
  if (confirmCallback) confirmCallback();
  closeConfirm();
};

function showToast(msg, type = "success") {
  const toast = document.getElementById('toast');
  toast.innerText = msg;
  toast.style.background = type === "error" ? "#EF4444" : "#22c55e";
  toast.style.display = 'block';
  setTimeout(() => toast.style.display = 'none', 3500);
}

document.getElementById('searchInput').oninput = renderOrders;
document.getElementById('statusFilter').onchange = renderOrders;
document.getElementById('sortFilter').onchange = renderOrders;
</script>
</body>
</html>
