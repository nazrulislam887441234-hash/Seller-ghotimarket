<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Locked | Ghoti Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2c3e50; --danger: #e74c3c; }
        body { font-family: 'Hind Siliguri', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .lock-container { background: white; padding: 40px 30px; border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); max-width: 400px; width: 100%; text-align: center; border-top: 5px solid var(--danger); margin-bottom: 20px; }
        .lock-icon { font-size: 60px; color: var(--danger); background: #ffebee; width: 100px; height: 100px; line-height: 100px; border-radius: 50%; margin: 0 auto 20px; animation: shake 0.5s ease-in-out infinite alternate; }
        @keyframes shake { 0% { transform: rotate(-5deg); } 100% { transform: rotate(5deg); } }
        
        h1 { font-size: 24px; color: #333; margin: 0 0 10px; }
        p { color: #666; font-size: 15px; margin-bottom: 20px; }

        .pack-card { background: white; padding: 20px; border-radius: 20px; margin-bottom: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; max-width: 400px; width: 100%; }
        .price { font-size: 28px; font-weight: bold; color: #2c3e50; }
        .wa-btn { background: #25d366; color: white; padding: 15px; border-radius: 12px; display: block; text-decoration: none; font-weight: bold; margin-top: 10px; }
        .wa-btn:hover { background: #1ebe57; }
    </style>
</head>
<body>

    <div class="lock-container">
        <div class="lock-icon">
            <i class="fas fa-lock"></i>
        </div>
        <h1>আপনার একাউন্ট লক করা</h1>
        <p>আপনার পণ্যের প্রমোশন এবং সেলার ড্যাশবোর্ড সচল রাখতে নিচে থেকে যেকোনো একটি সাবস্ক্রিপশন কিনুন।</p>
    </div>

    <div id="plans" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        </div>

    <script type="module">
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        
        const firebaseConfig = { projectId: "ghotimarket" };
        const db = getFirestore(initializeApp(firebaseConfig));

        onSnapshot(collection(db, "packages"), snap => {
            let html = "";
            snap.forEach(d => {
                let p = d.data();
                let waLink = `https://wa.me/8801316487435?text=আমি ${p.name} টি কিনতে চাই। দাম: ${p.price} টাকা, মেয়াদ: ${p.days} দিন।`;
                html += `<div class='pack-card'>
                    <h3 style="margin-top:0">${p.name}</h3>
                    <div class='price'>৳ ${p.price}</div>
                    <p style="margin:5px 0">মেয়াদ: ${p.days} দিন</p>
                    <p style='white-space:pre-line; color:#555;'>${p.desc}</p>
                    <a href='${waLink}' class='wa-btn'><i class="fab fa-whatsapp"></i> এই প্যাকটি কিনুন</a>
                </div>`;
            });
            document.getElementById('plans').innerHTML = html;
        });
    </script>
</body>
</html>
