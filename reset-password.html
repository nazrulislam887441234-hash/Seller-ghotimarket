<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পাসওয়ার্ড রিসেট করুন | GHOTI MARKET</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        :root {
            --gm-dark: #1a2a3a;  /* GHOTI MARKET Dark */
            --gm-blue: #00a8ff;  /* GHOTI MARKET Blue */
            --gm-light: #f0f8ff;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Hind Siliguri', sans-serif; background: linear-gradient(135deg, var(--gm-dark) 0%, var(--gm-blue) 100%); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        .container { background: white; padding: 45px 35px; border-radius: 25px; box-shadow: 0 25px 60px rgba(0,0,0,0.3); max-width: 470px; width: 100%; text-align: center; animation: slideUp 0.6s ease; border-top: 5px solid var(--gm-blue); }
        @keyframes slideUp { from {opacity: 0; transform: translateY(30px);} to {opacity: 1; transform: translateY(0);} }
        
        .logo-link { display: inline-block; margin-bottom: 15px; transition: 0.3s; }
        .logo-link:hover { transform: scale(1.05); }
        .logo { height: 55px; width: auto; } 
        
        h1 { color: var(--gm-dark); font-size: 26px; margin: 0 0 10px; font-weight: 700; }
        p { color: #666; font-size: 15px; margin-bottom: 30px; line-height: 1.7; }
        
        .input-group { position: relative; margin-bottom: 22px; }
        .input-group i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--gm-blue); font-size: 18px; }
        input { width: 100%; padding: 16px 16px 16px 50px; border: 2px solid #e8e8e8; border-radius: 12px; font-size: 16px; transition: 0.3s; font-family: 'Hind Siliguri', sans-serif; }
        input:focus { outline: none; border-color: var(--gm-blue); box-shadow: 0 0 0 4px rgba(0,168,255,0.15); }
        
        .btn { width: 100%; padding: 16px; background: linear-gradient(90deg, var(--gm-dark), var(--gm-blue)); color: white; border: none; border-radius: 12px; font-size: 17px; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,168,255,0.4); }
        .btn:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .back { margin-top: 25px; }
        .back a { color: var(--gm-dark); text-decoration: none; font-weight: 600; transition: 0.3s; }
        .back a:hover { color: var(--gm-blue); }

        /* GHOTI MARKET BRAND POPUP */
        .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(26,42,58,0.7); display: none; align-items: center; justify-content: center; z-index: 999; backdrop-filter: blur(8px); }
        .popup { background: white; padding: 40px 30px; border-radius: 20px; max-width: 420px; width: 90%; text-align: center; animation: popIn 0.4s ease; border-top: 4px solid var(--gm-blue); }
        @keyframes popIn { from {transform: scale(0.8); opacity: 0;} to {transform: scale(1); opacity: 1;} }
        .popup-icon { font-size: 55px; margin-bottom: 15px; }
        .popup.success { border-top-color: #28a745; }
        .popup.success .popup-icon { color: #28a745; }
        .popup.error { border-top-color: #dc3545; }
        .popup.error .popup-icon { color: #dc3545; }
        .popup h2 { margin: 0 0 12px; font-size: 22px; color: var(--gm-dark); font-weight: 700; }
        .popup p { margin: 0 0 25px; color: #555; font-size: 15px; }
        .popup-btn { padding: 14px 35px; border: none; border-radius: 10px; background: linear-gradient(90deg, var(--gm-dark), var(--gm-blue)); color: white; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .popup-btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="container">
        <a href="https://ghotimarket.com" class="logo-link">
            <img src="https://ghotimarket.com/logo.png" alt="GHOTI MARKET Logo" class="logo">
        </a>
        <h1>পাসওয়ার্ড ভুলে গেছেন?</h1>
        <p>টেনশন নেই! আপনার রেজিস্টার করা ইমেইল দিন। আমরা ২ মিনিটের মধ্যে রিসেট লিংক পাঠিয়ে দিবো।</p>

        <form id="forgotForm">
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="example@gmail.com" required>
            </div>
            <button type="submit" class="btn" id="resetBtn"><i class="fas fa-paper-plane"></i> রিসেট লিংক পাঠান</button>
        </form>

    <div class="back">
    <a href="#" id="backBtn">
        <i class="fas fa-arrow-left"></i> ফিরে যান
    </a>
</div>
    </div>

    <!-- GHOTI MARKET Custom Popup -->
    <div class="popup-overlay" id="popupOverlay" onclick="closePopup()">
        <div class="popup" id="popupBox" onclick="event.stopPropagation()">
            <div class="popup-icon" id="popupIcon"></div>
            <h2 id="popupTitle"></h2>
            <p id="popupMsg"></p>
            <button class="popup-btn" onclick="closePopup()">ঠিক আছে</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE", 
            authDomain: "ghotimarket.firebaseapp.com", 
            projectId: "ghotimarket", 
            storageBucket: "ghotimarket.firebasestorage.app", 
            messagingSenderId: "481257644093", 
            appId: "1:481257644093:web:0dfc3699d6b3c86afeca54" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById('forgotForm');
        const btn = document.getElementById('resetBtn');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> পাঠানো হচ্ছে...';

            sendPasswordResetEmail(auth, email)
            .then(() => {
                showPopup('success', 'ইমেইল পাঠানো হয়েছে!', `আমরা ${email} ঠিকানায় পাসওয়ার্ড রিসেট লিংক পাঠিয়েছি। ২ মিনিটের মধ্যে না পেলে স্প্যাম/সব ফোল্ডার চেক করুন।`);
            })
            .catch((error) => {
                let errorMessage = 'কোনো সমস্যা হয়েছে। আবার চেষ্টা করুন।';
                
                // এখানে Firebase এরর কোড ধরে কাস্টম মেসেজ
                if (error.code === 'auth/user-not-found') {
                    errorMessage = 'এই ইমেইল দিয়ে GHOTI MARKET এ কোনো অ্যাকাউন্ট পাওয়া যায়নি। দয়া করে সঠিক ইমেইল দিন অথবা নতুন অ্যাকাউন্ট খুলুন।';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'আপনার দেওয়া ইমেইলটি সঠিক নয়।';
                }

                showPopup('error', 'রিসেট করা যায়নি!', errorMessage);
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> রিসেট লিংক পাঠান';
            });
        });

        function showPopup(type, title, msg) {
            const popupBox = document.getElementById('popupBox');
            popupBox.className = `popup ${type}`;
            document.getElementById('popupIcon').innerHTML = type === 'success' ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-exclamation-circle"></i>';
            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupMsg').innerText = msg;
            document.getElementById('popupOverlay').style.display = 'flex';
        }
        
        window.closePopup = function() {
            document.getElementById('popupOverlay').style.display = 'none';
        }
document.getElementById("backBtn").addEventListener("click", function(e) {
    e.preventDefault();

    if (
        history.length > 1 &&
        document.referrer &&
        new URL(document.referrer).origin === location.origin
    ) {
        history.back();
    } else {
        window.location.replace("https://ghotimarket.com");
    }
});
    </script>
</body>
</html>
